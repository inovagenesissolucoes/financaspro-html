<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Detalhe do Cartão</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    .card-hero { padding:24px 20px; color:#fff; }
    .card-hero-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .back-btn { background:rgba(255,255,255,0.2); border:none; color:#fff; width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .card-name-big { font-size:22px; font-weight:800; margin-bottom:4px; }
    .card-info { font-size:12px; opacity:0.85; }
    .actions-row { display:flex; gap:8px; }
    .action-icon-btn { background:rgba(255,255,255,0.2); border:none; color:#fff; width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .invoice-box { background:rgba(255,255,255,0.15); border-radius:14px; padding:16px; margin-top:14px; }
    .invoice-lbl { font-size:11px; opacity:0.85; }
    .invoice-val-big { font-size:28px; font-weight:800; margin:6px 0; }
    .invoice-bar { height:6px; background:rgba(255,255,255,0.25); border-radius:3px; overflow:hidden; margin-top:10px; }
    .invoice-bar-fill { height:100%; background:#fff; transition:width 0.4s; }
    .invoice-row { display:flex; justify-content:space-between; margin-top:10px; font-size:11px; opacity:0.95; }
    .sec-title-detail { font-size:14px; font-weight:700; color:var(--text); margin-bottom:12px; }
    .insight-card { background:var(--bg-card); border:0.5px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
    .insight-icon { font-size:22px; flex-shrink:0; }
    .insight-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:4px; }
    .insight-desc { font-size:11px; color:var(--text-3); line-height:1.5; }
    .cat-row-detail { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:0.5px solid var(--border); }
    .cat-row-detail:last-child { border-bottom:none; }
    .cat-bar-track { background:var(--bg-input); height:6px; border-radius:3px; overflow:hidden; margin-top:6px; }
    .cat-bar-fill { height:100%; border-radius:3px; transition:width 0.5s; }
    .purchase-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:0.5px solid var(--border); }
    .purchase-item:last-child { border-bottom:none; }
    .purchase-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .purchase-body { flex:1; min-width:0; }
    .purchase-name { font-size:13px; font-weight:600; color:var(--text); }
    .purchase-cat { font-size:11px; color:var(--text-3); margin-top:2px; }
    .purchase-amt { font-size:13px; font-weight:700; color:var(--red); flex-shrink:0; }
    .tab-bar { display:flex; gap:6px; padding:0 14px 14px; }
    .tab-detail { flex:1; padding:8px 12px; background:var(--bg-card); border:0.5px solid var(--border); color:var(--text-3); border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
    .tab-detail.on { background:var(--accent-2); color:#fff; border-color:var(--accent-2); }
    .preset-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
    .preset-card { padding:10px 6px; border-radius:10px; cursor:pointer; border:2px solid transparent; text-align:center; transition:transform 0.15s; }
    .preset-card.active { border-color:var(--accent-2); box-shadow:0 0 0 2px var(--accent-2); }
    .preset-card span { font-size:10px; font-weight:700; color:#fff; }
  </style>
</head>
<body>
<div class="page">

  <div id="card-hero" class="card-hero" style="background:linear-gradient(135deg, #6D28D9, #4C1D95);">
    <div class="card-hero-top">
      <button class="back-btn" onclick="window.location.href='cards.html'">‹</button>
      <div class="actions-row">
        <button class="action-icon-btn" onclick="openEditModal()" title="Editar">✏️</button>
        <button class="action-icon-btn" onclick="openDeleteModal()" title="Excluir">🗑</button>
      </div>
    </div>
    <div class="card-name-big" id="card-name">Carregando...</div>
    <div class="card-info" id="card-info"></div>

    <div class="invoice-box">
      <div class="invoice-lbl" id="invoice-status">Fatura atual</div>
      <div class="invoice-val-big" id="invoice-total">R$ 0,00</div>
      <div class="invoice-row">
        <span>Limite disponível: <strong id="limit-available">R$ 0</strong></span>
        <span id="limit-pct">0%</span>
      </div>
      <div class="invoice-bar"><div class="invoice-bar-fill" id="invoice-bar-fill" style="width:0%;"></div></div>
      <div class="invoice-row">
        <span>Fecha: <strong id="closing-date">--</strong></span>
        <span>Vence: <strong id="due-date">--</strong></span>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-detail on" onclick="setTab('purchases',this)">📦 Compras</button>
    <button class="tab-detail" onclick="setTab('categories',this)">📊 Categorias</button>
    <button class="tab-detail" onclick="setTab('insights',this)">💡 Insights</button>
  </div>

  <div id="tab-content" style="padding:0 14px 14px;">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

</div>

<!-- Modal editar cartão -->
<div class="modal-overlay" id="edit-modal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Editar Cartão</span><button class="modal-close" onclick="closeEditModal()">✕</button></div>
    <div class="field"><label class="field-label">Nome do cartão *</label><input type="text" id="e-name"></div>
    <div class="field"><label class="field-label">Limite total (R$)</label><input type="text" id="e-limit" inputmode="decimal" oninput="currencyInput(this)" onblur="currencyBlur(this)"></div>
    <div class="grid-2">
      <div class="field"><label class="field-label">Dia fechamento</label><input type="number" id="e-closing" min="1" max="31"></div>
      <div class="field"><label class="field-label">Dia vencimento</label><input type="number" id="e-due" min="1" max="31"></div>
    </div>
    <label class="field-label" style="margin-bottom:8px;display:block;">Cor / Banco</label>
    <div class="preset-grid" id="e-preset-colors"></div>
    <div class="field"><label class="field-label">Cor personalizada</label><input type="color" id="e-color" style="height:48px;cursor:pointer;width:100%;" onchange="onEditColorChange()"></div>
    <button class="btn btn-primary" id="e-save-btn" onclick="saveEdit()">Salvar Alterações</button>
  </div>
</div>

<!-- Modal confirmação exclusão -->
<div class="modal-overlay" id="confirm-delete-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="text-align:center;padding:8px 0 16px;">
      <div style="font-size:40px;margin-bottom:12px;">🗑️</div>
      <p style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;">Excluir cartão?</p>
      <p style="font-size:13px;color:var(--text-3);margin-bottom:4px;" id="confirm-card-name"></p>
      <p style="font-size:12px;color:var(--text-3);">As compras anteriores serão mantidas no histórico.</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="closeDeleteModal()" style="flex:1;padding:12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--text-3);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">Cancelar</button>
      <button onclick="confirmDelete()" id="confirm-delete-btn" style="flex:1;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--red);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">Excluir</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();

  const PRESETS = [
    {name:'Itaú',color:'#EC7000'},{name:'Nubank',color:'#820AD1'},{name:'Santander',color:'#EC0000'},
    {name:'Bradesco',color:'#CC092F'},{name:'Banco do BR',color:'#FAE128'},{name:'Caixa',color:'#0070AF'},
    {name:'Inter',color:'#FF7A00'},{name:'C6 Bank',color:'#1C1C1C'},{name:'BTG',color:'#003163'},
    {name:'Original',color:'#00B25C'},{name:'Next',color:'#00FF5F'},{name:'PicPay',color:'#11C76F'},
    {name:'Mercado Pago',color:'#00B1EA'},{name:'Will',color:'#6610F2'},{name:'Outro',color:'#6D28D9'}
  ];

  const COLORS = ['#4F46E5','#D97706','#DC2626','#16A34A','#0EA5E9','#EC4899','#F97316','#8B5CF6','#06B6D4'];
  const params = new URLSearchParams(window.location.search);
  const cardId = params.get('id');
  if (!cardId) window.location.href = 'cards.html';

  let card = null, allTransactions = [], invoiceTx = [], categories = [], allInvoices = [];
  let selectedEditColor = '#6D28D9';
  let activeTab = 'purchases';

  function currencyInput(el) { el.value = el.value.replace(/[^\d.,]/g,''); }
  function currencyBlur(el) {
    const num = parseCurrency(el.value);
    el.value = num > 0 ? num.toFixed(2).replace('.',',') : '';
  }
  function parseCurrency(val) {
    if (!val) return 0;
    let v = String(val).trim();
    if (v.includes('.')&&v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
    else if (v.includes(',')) v=v.replace(',','.');
    return parseFloat(v)||0;
  }

  function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);
    R = Math.max(0, Math.min(255, R));
    G = Math.max(0, Math.min(255, G));
    B = Math.max(0, Math.min(255, B));
    return '#' + R.toString(16).padStart(2,'0') + G.toString(16).padStart(2,'0') + B.toString(16).padStart(2,'0');
  }

  async function load() {
    const [cardsRes, txRes, invRes, catRes] = await Promise.all([
      API.listCards(),
      API.listTransactions({all:true}),
      API.call('invoices.list', {card_id: cardId}),
      API.listCategories()
    ]);

    const cards = cardsRes.success ? cardsRes.data : [];
    card = cards.find(c => c.card_id === cardId);
    if (!card) { Utils.toast('Cartão não encontrado','error'); setTimeout(()=>window.location.href='cards.html',1500); return; }

    allTransactions = txRes.success ? txRes.data.filter(t => t.card_id === cardId) : [];
    allInvoices = invRes.success ? invRes.data : [];
    categories = catRes.success ? catRes.data : [];

    const inv = card.current_invoice;
    invoiceTx = inv ? allTransactions.filter(t => t.invoice_id === inv.invoice_id) : [];

    renderHero();
    renderTab();
  }

  function renderHero() {
  const bgColor = card.color || '#6D28D9';
  document.getElementById('card-hero').style.background = `linear-gradient(135deg, ${bgColor}, ${shadeColor(bgColor,-25)})`;
  document.getElementById('card-name').textContent = card.name;
  document.getElementById('card-info').textContent = `Fecha dia ${card.closing_day} · Vence dia ${card.due_day}`;

  const limit = Number(card.limit_amount)||0;
  const inv = card.current_invoice;
  const used = Number(inv?.total_amount)||0;
  const available = Math.max(0, limit - used);
  const pct = limit>0 ? Math.min(100, Math.round((used/limit)*100)) : 0;

  document.getElementById('invoice-total').textContent = Utils.formatCurrency(used);
  document.getElementById('limit-available').textContent = Utils.formatCurrency(available);
  document.getElementById('limit-pct').textContent = pct + '% usado';
  document.getElementById('invoice-bar-fill').style.width = pct + '%';

  const statusLabel = inv ? (inv.status==='paid' ? '✅ Fatura paga' : inv.status==='closed' ? '🔒 Fatura fechada' : '🔓 Fatura aberta') : '🔓 Fatura aberta';
  document.getElementById('invoice-status').textContent = statusLabel;

  if (inv && inv.due_date) {
    const dueDate = new Date(String(inv.due_date).split('T')[0] + 'T12:00:00');
    document.getElementById('due-date').textContent = dueDate.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
    const closeDate = new Date(dueDate);
    if (Number(card.closing_day) >= Number(card.due_day)) {
      closeDate.setMonth(closeDate.getMonth() - 1);
    }
    closeDate.setDate(Number(card.closing_day));
    document.getElementById('closing-date').textContent = closeDate.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
  } else {
    document.getElementById('closing-date').textContent = '--';
    document.getElementById('due-date').textContent = '--';
  }
}

  function setTab(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.tab-detail').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
    renderTab();
  }

  function renderTab() {
    const container = document.getElementById('tab-content');

    if (activeTab === 'purchases') {
      if (invoiceTx.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:32px 16px;color:var(--text-3);font-size:13px;">Nenhuma compra na fatura atual.</div>`;
        return;
      }
      const sorted = [...invoiceTx].sort((a,b) => new Date(b.due_date) - new Date(a.due_date));
      container.innerHTML = `
        <div style="background:var(--bg-card);border-radius:14px;padding:14px;border:0.5px solid var(--border);">
          <div class="sec-title-detail">Compras da fatura</div>
          ${sorted.map(t => {
            const cat = categories.find(c => c.category_id === t.category_id);
            return `
              <div class="purchase-item">
                <div class="purchase-icon" style="background:${(cat?.color||'#6366F1')}22;">${cat?.icon||'💳'}</div>
                <div class="purchase-body">
                  <div class="purchase-name">${t.description}</div>
                  <div class="purchase-cat">${cat?(cat.name+(cat.subcategory?' · '+cat.subcategory:'')):'Sem categoria'} · ${Utils.formatDate(t.due_date)}</div>
                </div>
                <div class="purchase-amt">-${Utils.formatCurrency(t.expected_amount)}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    if (activeTab === 'categories') {
      const breakdown = {};
      invoiceTx.forEach(t => {
        const catId = t.category_id || 'uncategorized';
        const cat = categories.find(c => c.category_id === catId);
        const name = cat?.name || 'Sem categoria';
        if (!breakdown[name]) breakdown[name] = {total:0, count:0, color:cat?.color||'#94A3B8', icon:cat?.icon||'💰'};
        breakdown[name].total += Number(t.expected_amount||0);
        breakdown[name].count++;
      });
      const sorted = Object.entries(breakdown).sort((a,b)=>b[1].total - a[1].total);
      const max = sorted[0]?.[1].total || 1;
      const total = sorted.reduce((s,[,v])=>s+v.total, 0);

      if (sorted.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:32px 16px;color:var(--text-3);font-size:13px;">Sem compras para categorizar.</div>`;
        return;
      }

      container.innerHTML = `
        <div style="background:var(--bg-card);border-radius:14px;padding:14px;border:0.5px solid var(--border);">
          <div class="sec-title-detail">Gastos por categoria</div>
          ${sorted.map(([name, d], i) => {
            const pct = Math.round((d.total/max)*100);
            const pctTotal = Math.round((d.total/total)*100);
            const color = COLORS[i % COLORS.length];
            return `
              <div class="cat-row-detail">
                <div style="width:36px;height:36px;border-radius:10px;background:${color}22;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">${d.icon}</div>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
                    <span style="font-size:13px;font-weight:600;color:var(--text);">${name}</span>
                    <span style="font-size:13px;font-weight:700;color:${color};">${Utils.formatCurrency(d.total)}</span>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-bottom:4px;">
                    <span>${d.count} compra${d.count>1?'s':''}</span>
                    <span>${pctTotal}% da fatura</span>
                  </div>
                  <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    if (activeTab === 'insights') {
      renderInsights(container);
    }
  }

  function renderInsights(container) {
    const insights = [];
    const total = invoiceTx.reduce((s,t)=>s+Number(t.expected_amount||0), 0);
    const limit = Number(card.limit_amount)||0;
    const pct = limit>0 ? (total/limit)*100 : 0;

    // Insight 1: uso do limite
    if (pct > 80) {
      insights.push({icon:'⚠️',title:'Limite quase no teto',desc:`Você já usou ${Math.round(pct)}% do seu limite. Considere quitar parte da fatura ou reduzir gastos.`});
    } else if (pct > 50) {
      insights.push({icon:'📊',title:'Uso moderado do limite',desc:`Você utilizou ${Math.round(pct)}% do limite disponível neste ciclo.`});
    } else if (pct < 30 && total > 0) {
      insights.push({icon:'✅',title:'Uso saudável',desc:`Você está usando apenas ${Math.round(pct)}% do seu limite. Continue assim!`});
    }

    // Insight 2: comparação com fatura anterior
    const sortedInvs = [...allInvoices].sort((a,b)=>String(b.reference_month).localeCompare(String(a.reference_month)));
    const currentInv = card.current_invoice;
    const lastInv = sortedInvs.find(i => i.invoice_id !== currentInv?.invoice_id);
    if (lastInv && currentInv) {
      const lastTotal = Number(lastInv.total_amount)||0;
      const currTotal = Number(currentInv.total_amount)||0;
      if (lastTotal > 0) {
        const diff = currTotal - lastTotal;
        const diffPct = Math.round((diff/lastTotal)*100);
        if (diff > 0) {
          insights.push({icon:'📈',title:`Gastos ${diffPct}% maiores`,desc:`Você está gastando ${Utils.formatCurrency(Math.abs(diff))} a mais que o ciclo anterior (${Utils.formatCurrency(lastTotal)}).`});
        } else if (diff < 0) {
          insights.push({icon:'📉',title:`Economia de ${Math.abs(diffPct)}%`,desc:`Você está gastando ${Utils.formatCurrency(Math.abs(diff))} a menos que o ciclo anterior. Parabéns!`});
        }
      }
    }

    // Insight 3: categoria dominante
    const catBreakdown = {};
    invoiceTx.forEach(t => {
      const catId = t.category_id || 'uncategorized';
      const cat = categories.find(c => c.category_id === catId);
      const name = cat?.name || 'Sem categoria';
      if (!catBreakdown[name]) catBreakdown[name] = 0;
      catBreakdown[name] += Number(t.expected_amount||0);
    });
    const topCat = Object.entries(catBreakdown).sort((a,b)=>b[1]-a[1])[0];
    if (topCat && total > 0) {
      const catPct = Math.round((topCat[1]/total)*100);
      if (catPct > 40) {
        insights.push({icon:'🎯',title:`Concentração em ${topCat[0]}`,desc:`${catPct}% dos seus gastos estão em "${topCat[0]}" (${Utils.formatCurrency(topCat[1])}). Avalie se há oportunidade de equilibrar.`});
      } else {
        insights.push({icon:'🍕',title:`Maior gasto: ${topCat[0]}`,desc:`Sua maior categoria é "${topCat[0]}" com ${Utils.formatCurrency(topCat[1])} (${catPct}% do total).`});
      }
    }

    // Insight 4: maior compra única
    if (invoiceTx.length > 0) {
      const biggest = [...invoiceTx].sort((a,b)=>Number(b.expected_amount)-Number(a.expected_amount))[0];
      const biggestPct = total>0 ? Math.round((Number(biggest.expected_amount)/total)*100) : 0;
      if (biggestPct > 30) {
        insights.push({icon:'💰',title:'Compra de destaque',desc:`"${biggest.description}" representa ${biggestPct}% da fatura (${Utils.formatCurrency(biggest.expected_amount)}).`});
      }
    }

    // Insight 5: número de compras
    if (invoiceTx.length >= 20) {
      insights.push({icon:'🔢',title:`${invoiceTx.length} compras no ciclo`,desc:`Média de ${Utils.formatCurrency(total/invoiceTx.length)} por compra. Muitas transações pequenas podem indicar gastos impulsivos.`});
    } else if (invoiceTx.length > 0) {
      insights.push({icon:'📝',title:`${invoiceTx.length} compra${invoiceTx.length>1?'s':''} no ciclo`,desc:`Média de ${Utils.formatCurrency(total/invoiceTx.length)} por compra.`});
    }

    // Insight 6: dias até vencimento (usando data real da fatura)
    if (card.current_invoice && card.current_invoice.due_date && total > 0) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const dueDate = new Date(String(card.current_invoice.due_date).split('T')[0] + 'T12:00:00');
      const daysUntilDue = Math.ceil((dueDate - today) / (1000*60*60*24));
      if (daysUntilDue >= 0 && daysUntilDue <= 10) {
        insights.push({icon:'⏰',title:`Fatura vence em ${daysUntilDue} dia${daysUntilDue!==1?'s':''}`,desc:`Prepare-se para pagar ${Utils.formatCurrency(total)} até ${dueDate.toLocaleDateString('pt-BR')}.`});
      }
    }

    if (insights.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:32px 16px;color:var(--text-3);font-size:13px;">Sem dados suficientes para gerar insights. Faça compras no cartão para começar a ver análises.</div>`;
      return;
    }

    container.innerHTML = insights.map(i => `
      <div class="insight-card">
        <div class="insight-icon">${i.icon}</div>
        <div style="flex:1;">
          <div class="insight-title">${i.title}</div>
          <div class="insight-desc">${i.desc}</div>
        </div>
      </div>
    `).join('');
  }

  function renderEditPresets() {
    document.getElementById('e-preset-colors').innerHTML = PRESETS.map(p => `
      <div class="preset-card ${p.color===selectedEditColor?'active':''}" style="background:${p.color};" onclick="selectEditPreset('${p.color}')">
        <span>${p.name}</span>
      </div>
    `).join('');
  }

  function selectEditPreset(color) {
    selectedEditColor = color;
    document.getElementById('e-color').value = color;
    renderEditPresets();
  }

  function onEditColorChange() {
    selectedEditColor = document.getElementById('e-color').value;
    renderEditPresets();
  }

  function openEditModal() {
    selectedEditColor = card.color || '#6D28D9';
    document.getElementById('e-name').value = card.name;
    document.getElementById('e-limit').value = Number(card.limit_amount||0).toFixed(2).replace('.',',');
    document.getElementById('e-closing').value = card.closing_day;
    document.getElementById('e-due').value = card.due_day;
    document.getElementById('e-color').value = selectedEditColor;
    renderEditPresets();
    document.getElementById('edit-modal').classList.add('open');
  }
  function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); }

  async function saveEdit() {
    const name = document.getElementById('e-name').value.trim();
    if (!name) { Utils.toast('Digite o nome do cartão','error'); return; }
    const btn = document.getElementById('e-save-btn');
    btn.disabled=true; btn.textContent='Salvando...';
    const res = await API.call('cards.update', {
      card_id: cardId,
      name,
      limit_amount: parseCurrency(document.getElementById('e-limit').value)||0,
      closing_day: parseInt(document.getElementById('e-closing').value)||1,
      due_day: parseInt(document.getElementById('e-due').value)||10,
      color: selectedEditColor
    });
    btn.disabled=false; btn.textContent='Salvar Alterações';
    if (res.success) { Utils.toast('✅ Cartão atualizado!'); closeEditModal(); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  function openDeleteModal() {
    document.getElementById('confirm-card-name').textContent = card.name;
    document.getElementById('confirm-delete-modal').classList.add('open');
  }
  function closeDeleteModal() { document.getElementById('confirm-delete-modal').classList.remove('open'); }

  async function confirmDelete() {
    const btn = document.getElementById('confirm-delete-btn');
    btn.disabled=true; btn.textContent='Excluindo...';
    const res = await API.call('cards.update', {card_id: cardId, is_active: false});
    btn.disabled=false; btn.textContent='Excluir';
    if (res.success) { Utils.toast('✅ Cartão excluído!'); setTimeout(()=>window.location.href='cards.html', 1000); }
    else Utils.toast(res.error||'Erro','error');
  }

  load();
</script>
</body>
</html>
