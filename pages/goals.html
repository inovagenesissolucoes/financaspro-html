<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Metas</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row">
      <div style="display:flex;align-items:center;gap:10px;">
        <a href="dashboard.html" class="back-btn">‹</a>
        <div>
          <h1 class="page-hero-title">Metas</h1>
          <p class="page-hero-sub">Seus objetivos financeiros</p>
        </div>
      </div>
      <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
    </div>
  </div>

  <div id="list-container" style="padding:14px;">
    <div class="skeleton"></div>
    <div class="skeleton" style="height:140px;"></div>
  </div>

</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="openModal()"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab"><i class="ti ti-credit-card"></i><span>Cartões</span></a>
    <a href="goals.html" class="ntab on"><i class="ti ti-target"></i><span>Metas</span><span class="ndot"></span></a>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Nova Meta</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label class="field-label">Nome da meta *</label><input type="text" id="g-name" placeholder="Ex: Viagem, Reserva emergência..."></div>
    <div class="field"><label class="field-label">Valor alvo (R$) *</label><input type="number" id="g-target" placeholder="10000" step="0.01" min="0"></div>
    <div class="field"><label class="field-label">Contribuição mensal (R$)</label><input type="number" id="g-monthly" placeholder="500" step="0.01" min="0"></div>
    <div class="field"><label class="field-label">Data alvo</label><input type="date" id="g-date"></div>
    <button class="btn btn-primary" id="save-btn" onclick="saveGoal()">Criar Meta</button>
  </div>
</div>

<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title" id="add-modal-title">Adicionar à Meta</span><button class="modal-close" onclick="closeAddModal()">✕</button></div>
    <div class="field"><label class="field-label">Valor a adicionar (R$) *</label><input type="number" id="add-amount" placeholder="0,00" step="0.01" min="0"></div>
    <button class="btn btn-primary" id="add-btn" onclick="saveAddAmount()">💰 Adicionar</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('goals.html');

  let goals = [], selectedGoal = null;
  const GOAL_GRADIENTS = ['linear-gradient(90deg,#4F46E5,#A855F7)','linear-gradient(90deg,#0369A1,#0EA5E9)','linear-gradient(90deg,#065F46,#10B981)','linear-gradient(90deg,#BE185D,#EC4899)'];

  async function load() {
    const res = await API.listGoals();
    goals = res.success ? res.data : [];

    if (goals.length === 0) {
      document.getElementById('list-container').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎯</div>
          <p class="empty-text">Defina suas metas financeiras</p>
          <button class="btn btn-primary" style="max-width:220px;margin:0 auto;" onclick="openModal()">Criar primeira meta</button>
        </div>`;
      return;
    }

    const active = goals.filter(g=>g.status!=='completed');
    const done   = goals.filter(g=>g.status==='completed');

    let html = active.map((g,i) => {
      const curr    = Number(g.current_amount)||0;
      const target  = Number(g.target_amount)||1;
      const monthly = Number(g.monthly_contribution)||0;
      const pct     = Math.min(100, Math.round((curr/target)*100));
      const remaining = Math.max(0, target - curr);
      const months    = monthly > 0 ? Math.ceil(remaining/monthly) : null;
      return `
        <div class="gcard">
          <div class="gcard-top">
            <span class="gcard-name">${g.name}</span>
            <span class="gcard-pct">${pct}%</span>
          </div>
          ${g.target_date ? `<p style="font-size:10px;color:var(--text-3);margin-bottom:8px;">📅 Meta: ${Utils.formatDate(g.target_date)}</p>` : ''}
          <div class="gcard-amounts">
            <span class="gcard-curr">${Utils.formatCurrency(curr)}</span>
            <span class="gcard-target">de ${Utils.formatCurrency(target)}</span>
          </div>
          <div class="gcard-prog"><div class="gcard-fill" style="width:${pct}%;background:${GOAL_GRADIENTS[i%GOAL_GRADIENTS.length]};"></div></div>
          <div class="gcard-footer">
            <span class="gcard-info">${months ? `~${months} meses restantes` : `${Utils.formatCurrency(remaining)} restante`}</span>
            <button class="gcard-btn" onclick="openAddModal('${g.goal_id}','${g.name}',${curr},${target})">+ Adicionar</button>
          </div>
        </div>`;
    }).join('');

    if (done.length > 0) {
      html += `<p style="font-size:11px;font-weight:700;color:var(--text-3);margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.05em;">Concluídas</p>`;
      html += done.map(g=>`
        <div class="gcard" style="opacity:0.7;border-color:var(--green-bg);">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:1.3rem;">✅</span>
            <div>
              <p style="font-size:13px;font-weight:600;color:var(--text);">${g.name}</p>
              <p style="font-size:11px;color:var(--green);">Concluída! ${Utils.formatCurrency(g.target_amount)}</p>
            </div>
          </div>
        </div>`).join('');
    }

    document.getElementById('list-container').innerHTML = html;
  }

  function openModal() { document.getElementById('modal-overlay').classList.add('open'); }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  function openAddModal(goalId, name, curr, target) {
    selectedGoal = { goalId, curr, target };
    document.getElementById('add-modal-title').textContent = name;
    document.getElementById('add-amount').value = '';
    document.getElementById('add-modal').classList.add('open');
  }
  function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); selectedGoal = null; }

  async function saveAddAmount() {
    const amount = parseFloat(document.getElementById('add-amount').value);
    if (!amount || !selectedGoal) { Utils.toast('Digite um valor','error'); return; }
    const newAmount = Math.min(selectedGoal.target, selectedGoal.curr + amount);
    const isComplete = newAmount >= selectedGoal.target;
    const btn = document.getElementById('add-btn');
    btn.disabled=true; btn.textContent='Salvando...';
    const res = await API.updateGoal({goal_id:selectedGoal.goalId, current_amount:newAmount, status:isComplete?'completed':'active'});
    btn.disabled=false; btn.textContent='💰 Adicionar';
    if (res.success) { Utils.toast(isComplete?'🎉 Meta concluída!':'💰 Meta atualizada!'); closeAddModal(); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  async function saveGoal() {
    const name   = document.getElementById('g-name').value.trim();
    const target = parseFloat(document.getElementById('g-target').value);
    if (!name || !target) { Utils.toast('Preencha nome e valor alvo','error'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled=true; btn.textContent='Salvando...';
    const res = await API.createGoal({name, target_amount:target, monthly_contribution:parseFloat(document.getElementById('g-monthly').value)||0, target_date:document.getElementById('g-date').value, current_amount:0});
    btn.disabled=false; btn.textContent='Criar Meta';
    if (res.success) { Utils.toast('🎯 Meta criada!'); closeModal(); ['g-name','g-target','g-monthly','g-date'].forEach(id=>document.getElementById(id).value=''); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  load();
</script>
</body>
</html>
