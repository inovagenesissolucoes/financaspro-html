<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Metas</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    .gd-stat{background:var(--bg-input);border-radius:10px;padding:10px;}
    .gd-stat-lbl{font-size:10px;color:var(--text-3);}
    .gd-stat-val{font-size:14px;font-weight:700;color:var(--text);margin-top:2px;}
    .apt-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);}
    .apt-row:last-child{border-bottom:none;}
    .apt-ico{width:34px;height:34px;border-radius:10px;background:#16A34A22;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 14px 4px;}
    .summary-mini{background:var(--bg-card);border:0.5px solid var(--border);border-radius:14px;padding:14px;}
    .summary-mini-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px;}
    .summary-mini-lbl{font-size:11px;color:var(--text-3);margin-bottom:2px;}
    .summary-mini-val{font-size:16px;font-weight:800;color:var(--text);}
    .summary-mini-sub{font-size:10px;color:var(--text-3);margin-top:2px;}
  </style>
</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
        <div>
          <h1 class="page-hero-title">Metas</h1>
          <p class="page-hero-sub">Seus objetivos financeiros</p>
        </div>
      </div>
    </div>
  </div>

  <div id="summary-container"></div>

  <div id="list-container" style="padding:14px;">
    <div class="skeleton"></div>
    <div class="skeleton" style="height:140px;"></div>
  </div>

</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="openModal()"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab"><i class="ti ti-credit-card"></i><span>Cartões</span></a>
    <a href="goals.html" class="ntab on"><i class="ti ti-target"></i><span>Metas</span><span class="ndot"></span></a>
  </div>
</div>

<!-- Modal nova/editar meta -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title" id="goal-modal-title">Nova Meta</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <input type="hidden" id="g-id">
    <div class="field"><label class="field-label">Nome da meta *</label><input type="text" id="g-name" placeholder="Ex: Viagem, Reserva emergência..."></div>
    <div class="field"><label class="field-label">Valor alvo (R$) *</label><input type="number" id="g-target" placeholder="10000" step="0.01" min="0"></div>
    <div class="field"><label class="field-label">Contribuição mensal (R$)</label><input type="number" id="g-monthly" placeholder="500" step="0.01" min="0"></div>
    <div class="field"><label class="field-label">Data alvo</label><input type="date" id="g-date"></div>
    <button class="btn btn-primary" id="save-btn" onclick="saveGoal()">Criar Meta</button>
  </div>
</div>

<!-- Modal adicionar valor (aporte) -->
<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title" id="add-modal-title">Guardar dinheiro</span><button class="modal-close" onclick="closeAddModal()">✕</button></div>
    <div class="field"><label class="field-label">Valor a guardar (R$) *</label><input type="number" id="add-amount" placeholder="0,00" step="0.01" min="0"></div>
    <div class="field"><label class="field-label">De qual conta? *</label><select id="add-account"><option value="">Selecione</option></select></div>
    <div class="field"><label class="field-label">Data</label><input type="date" id="add-date"></div>
    <p style="font-size:10px;color:var(--text-3);margin-bottom:12px;">💡 O valor sai da conta escolhida e entra na meta.</p>
    <button class="btn btn-primary" id="add-btn" onclick="saveAddAmount()">💰 Guardar</button>
  </div>
</div>

<!-- Modal detalhe da meta -->
<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title" id="gd-name">Meta</span><button class="modal-close" onclick="closeDetail()">✕</button></div>
    <div id="gd-body"></div>
    <button class="btn btn-primary" onclick="openAddModalFromDetail()" style="margin-top:6px;">💰 Guardar dinheiro</button>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button onclick="editGoalFromDetail()" style="flex:1;padding:12px;border-radius:var(--radius-sm);border:1.5px solid var(--accent-2);background:transparent;color:var(--accent-2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">✏️ Editar</button>
      <button onclick="deleteGoalFromDetail()" style="flex:1;padding:12px;border-radius:var(--radius-sm);border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">🗑 Excluir</button>
    </div>
  </div>
</div>

<!-- Modal confirmar exclusão -->
<div class="modal-overlay" id="confirm-delete-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="text-align:center;padding:8px 0 16px;">
      <div style="font-size:40px;margin-bottom:12px;">🗑️</div>
      <p style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;">Excluir meta?</p>
      <p style="font-size:13px;color:var(--text-3);margin-bottom:4px;" id="confirm-goal-name"></p>
      <p style="font-size:12px;color:var(--text-3);">Os aportes já feitos continuam no seu histórico de lançamentos.</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="closeConfirmDelete()" style="flex:1;padding:12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--text-3);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">Cancelar</button>
      <button onclick="doDeleteGoal()" id="confirm-delete-btn" style="flex:1;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--red);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">Excluir</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('goals.html');

  let goals = [], accounts = [], allContributions = [], selectedGoal = null, addFromDetail = false;
  const GOAL_GRADIENTS = ['linear-gradient(90deg,#4F46E5,#A855F7)','linear-gradient(90deg,#0369A1,#0EA5E9)','linear-gradient(90deg,#065F46,#10B981)','linear-gradient(90deg,#BE185D,#EC4899)'];

  function gradFor(i) { return GOAL_GRADIENTS[i % GOAL_GRADIENTS.length]; }

  async function load() {
    const [goalRes, txRes, accRes] = await Promise.all([
      API.listGoals(),
      API.listTransactions({all:true}),
      API.listAccounts()
    ]);
    goals = goalRes.success ? goalRes.data : [];
    accounts = accRes.success ? accRes.data : [];
    allContributions = (txRes.success ? txRes.data : []).filter(t => String(t.notes||'').indexOf('Aporte meta ') === 0);

    if (goals.length === 0) {
      document.getElementById('summary-container').innerHTML = '';
      document.getElementById('list-container').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎯</div>
          <p class="empty-text">Defina suas metas financeiras</p>
          <button class="btn btn-primary" style="max-width:220px;margin:0 auto;" onclick="openModal()">Criar primeira meta</button>
        </div>`;
      return;
    }

    const active = goals.filter(g=>g.status!=='completed');
    const done   = goals.filter(g=>g.status==='completed');

    // Resumo geral (só com mais de uma meta)
    const sumEl = document.getElementById('summary-container');
    if (goals.length > 1) {
      const totalSaved  = goals.reduce((s,g)=>s+Number(g.current_amount||0), 0);
      const totalTarget = goals.reduce((s,g)=>s+Number(g.target_amount||0), 0);
      const remaining   = Math.max(0, totalTarget - totalSaved);
      const pctGeral    = totalTarget>0 ? Math.min(100, Math.round((totalSaved/totalTarget)*100)) : 0;
      const withDate = active.filter(g=>g.target_date).sort((a,b)=>String(a.target_date).localeCompare(String(b.target_date)));
      const next = withDate[0] || null;
      sumEl.innerHTML = `
        <div class="summary-grid">
          <div class="summary-mini">
            <div class="summary-mini-icon" style="background:#DCFCE7;">💰</div>
            <div class="summary-mini-lbl">Guardado</div>
            <div class="summary-mini-val" style="color:var(--green);">${Utils.formatCurrency(totalSaved)}</div>
            <div class="summary-mini-sub">${pctGeral}% do alvo total</div>
          </div>
          <div class="summary-mini">
            <div class="summary-mini-icon" style="background:#FEE2E2;">🎯</div>
            <div class="summary-mini-lbl">Falta</div>
            <div class="summary-mini-val">${Utils.formatCurrency(remaining)}</div>
            <div class="summary-mini-sub">de ${Utils.formatCurrency(totalTarget)}</div>
          </div>
          <div class="summary-mini">
            <div class="summary-mini-icon" style="background:#DBEAFE;">📅</div>
            <div class="summary-mini-lbl">Próxima meta</div>
            <div class="summary-mini-val">${next ? Utils.formatDate(next.target_date) : '--'}</div>
            <div class="summary-mini-sub">${next ? next.name : 'Sem data'}</div>
          </div>
          <div class="summary-mini">
            <div class="summary-mini-icon" style="background:#F3E8FF;">📊</div>
            <div class="summary-mini-lbl">Metas ativas</div>
            <div class="summary-mini-val">${active.length}</div>
            <div class="summary-mini-sub">${done.length} concluída${done.length!==1?'s':''}</div>
          </div>
        </div>`;
    } else {
      sumEl.innerHTML = '';
    }

    let html = active.map((g,i) => {
      const curr    = Number(g.current_amount)||0;
      const target  = Number(g.target_amount)||1;
      const monthly = Number(g.monthly_contribution)||0;
      const pct     = Math.min(100, Math.round((curr/target)*100));
      const remaining = Math.max(0, target - curr);
      const months    = monthly > 0 ? Math.ceil(remaining/monthly) : null;
      return `
        <div class="gcard" style="cursor:pointer;" onclick="openDetail('${g.goal_id}')">
          <div class="gcard-top">
            <span class="gcard-name">${g.name}</span>
            <span class="gcard-pct">${pct}%</span>
          </div>
          ${g.target_date ? `<p style="font-size:10px;color:var(--text-3);margin-bottom:8px;">📅 Meta: ${Utils.formatDate(g.target_date)}</p>` : ''}
          <div class="gcard-amounts">
            <span class="gcard-curr">${Utils.formatCurrency(curr)}</span>
            <span class="gcard-target">de ${Utils.formatCurrency(target)}</span>
          </div>
          <div class="gcard-prog"><div class="gcard-fill" style="width:${pct}%;background:${gradFor(i)};"></div></div>
          <div class="gcard-footer">
            <span class="gcard-info">${months ? `~${months} ${months>1?'meses':'mês'} restantes` : `${Utils.formatCurrency(remaining)} restante`}</span>
            <button class="gcard-btn" onclick="event.stopPropagation();openAddModal('${g.goal_id}')">+ Guardar</button>
          </div>
        </div>`;
    }).join('');

    if (done.length > 0) {
      html += `<p style="font-size:11px;font-weight:700;color:var(--text-3);margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.05em;">Concluídas</p>`;
      html += done.map(g=>`
        <div class="gcard" style="opacity:0.75;border-color:var(--green-bg);cursor:pointer;" onclick="openDetail('${g.goal_id}')">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:1.3rem;">✅</span>
            <div>
              <p style="font-size:13px;font-weight:600;color:var(--text);">${g.name}</p>
              <p style="font-size:11px;color:var(--green);">Concluída! ${Utils.formatCurrency(g.target_amount)}</p>
            </div>
          </div>
        </div>`).join('');
    }

    document.getElementById('list-container').innerHTML = html;

    // Se o detalhe estava aberto, atualiza
    if (selectedGoal && document.getElementById('detail-modal').classList.contains('open')) {
      renderDetail(selectedGoal);
    }
  }

  // ── Detalhe ────────────────────────────────────────────
  function openDetail(goalId) { selectedGoal = goalId; renderDetail(goalId); document.getElementById('detail-modal').classList.add('open'); }
  function closeDetail() { document.getElementById('detail-modal').classList.remove('open'); selectedGoal = null; }

  function renderDetail(goalId) {
    const g = goals.find(x => x.goal_id === goalId);
    if (!g) { closeDetail(); return; }
    const curr = Number(g.current_amount)||0, target = Number(g.target_amount)||1;
    const pct = Math.min(100, Math.round((curr/target)*100));
    const remaining = Math.max(0, target - curr);
    const monthly = Number(g.monthly_contribution)||0;
    const months = monthly>0 ? Math.ceil(remaining/monthly) : null;
    const contribs = allContributions
      .filter(c => String(c.notes) === 'Aporte meta ' + goalId)
      .sort((a,b)=> new Date(b.paid_date) - new Date(a.paid_date));

    document.getElementById('gd-name').textContent = g.name;
    document.getElementById('gd-body').innerHTML = `
      <div style="text-align:center;margin-bottom:14px;">
        <div style="font-size:30px;font-weight:800;color:var(--text);">${Utils.formatCurrency(curr)}</div>
        <div style="font-size:12px;color:var(--text-3);">de ${Utils.formatCurrency(target)} · ${pct}%</div>
        <div class="gcard-prog" style="margin-top:10px;"><div class="gcard-fill" style="width:${pct}%;background:${gradFor(0)};"></div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
        <div class="gd-stat"><div class="gd-stat-lbl">Falta guardar</div><div class="gd-stat-val">${Utils.formatCurrency(remaining)}</div></div>
        <div class="gd-stat"><div class="gd-stat-lbl">${months?'Previsão':'Aporte mensal'}</div><div class="gd-stat-val">${months?('~'+months+' '+(months>1?'meses':'mês')):(monthly>0?Utils.formatCurrency(monthly):'—')}</div></div>
      </div>
      ${g.target_date?`<p style="font-size:11px;color:var(--text-3);margin-bottom:14px;">📅 Data alvo: ${Utils.formatDate(g.target_date)}</p>`:''}
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;">Histórico de aportes ${contribs.length?`(${contribs.length})`:''}</div>
      ${contribs.length===0
        ? `<p style="font-size:12px;color:var(--text-3);padding-bottom:8px;">Nenhum aporte ainda. Toque em "Guardar dinheiro" para começar.</p>`
        : contribs.map(c=>`
            <div class="apt-row">
              <div class="apt-ico">💰</div>
              <div style="flex:1;"><div style="font-size:12px;color:var(--text-3);">${Utils.formatDate(c.paid_date)}</div></div>
              <div style="font-size:13px;font-weight:700;color:#16A34A;">+${Utils.formatCurrency(c.actual_amount)}</div>
            </div>`).join('')}
    `;
  }

  // ── Nova/Editar meta ───────────────────────────────────
  function openModal() {
    document.getElementById('g-id').value = '';
    document.getElementById('goal-modal-title').textContent = 'Nova Meta';
    document.getElementById('save-btn').textContent = 'Criar Meta';
    ['g-name','g-target','g-monthly','g-date'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('modal-overlay').classList.add('open');
  }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  function editGoalFromDetail() {
    const g = goals.find(x => x.goal_id === selectedGoal);
    if (!g) return;
    closeDetail();
    document.getElementById('g-id').value = g.goal_id;
    document.getElementById('goal-modal-title').textContent = 'Editar Meta';
    document.getElementById('save-btn').textContent = 'Salvar Alterações';
    document.getElementById('g-name').value = g.name;
    document.getElementById('g-target').value = Number(g.target_amount)||'';
    document.getElementById('g-monthly').value = Number(g.monthly_contribution)||'';
    document.getElementById('g-date').value = g.target_date ? String(g.target_date).split('T')[0] : '';
    document.getElementById('modal-overlay').classList.add('open');
  }

  async function saveGoal() {
    const name   = document.getElementById('g-name').value.trim();
    const target = parseFloat(document.getElementById('g-target').value);
    if (!name || !target) { Utils.toast('Preencha nome e valor alvo','error'); return; }
    const id = document.getElementById('g-id').value;
    const btn = document.getElementById('save-btn'); const label = btn.textContent;
    btn.disabled=true; btn.textContent='Salvando...';
    const payload = {
      name, target_amount:target,
      monthly_contribution: parseFloat(document.getElementById('g-monthly').value)||0,
      target_date: document.getElementById('g-date').value
    };
    const res = id
      ? await API.updateGoal({goal_id:id, ...payload})
      : await API.createGoal({...payload, current_amount:0});
    btn.disabled=false; btn.textContent=label;
    if (res.success) { Utils.toast(id?'✅ Meta atualizada!':'🎯 Meta criada!'); closeModal(); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  // ── Excluir ────────────────────────────────────────────
  function deleteGoalFromDetail() {
    const g = goals.find(x => x.goal_id === selectedGoal);
    if (!g) return;
    document.getElementById('confirm-goal-name').textContent = g.name;
    document.getElementById('detail-modal').classList.remove('open');
    document.getElementById('confirm-delete-modal').classList.add('open');
  }
  function closeConfirmDelete() { document.getElementById('confirm-delete-modal').classList.remove('open'); }
  async function doDeleteGoal() {
    if (!selectedGoal) return;
    const btn = document.getElementById('confirm-delete-btn'); btn.disabled=true; btn.textContent='Excluindo...';
    const res = await API.call('goals.delete', { goal_id: selectedGoal });
    btn.disabled=false; btn.textContent='Excluir';
    if (res.success) { Utils.toast('✅ Meta excluída!'); closeConfirmDelete(); selectedGoal=null; load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  // ── Aporte (guardar dinheiro) ──────────────────────────
  function openAddModal(goalId) {
    selectedGoal = goalId;
    addFromDetail = false;
    prepAddModal(goalId);
  }
  function openAddModalFromDetail() {
    addFromDetail = true;
    document.getElementById('detail-modal').classList.remove('open');
    prepAddModal(selectedGoal);
  }
  function prepAddModal(goalId) {
    const g = goals.find(x => x.goal_id === goalId);
    document.getElementById('add-modal-title').textContent = g ? g.name : 'Guardar dinheiro';
    document.getElementById('add-amount').value = '';
    document.getElementById('add-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('add-account').innerHTML = '<option value="">Selecione</option>' +
      accounts.map(a=>`<option value="${a.account_id}">${a.name} · ${Utils.formatCurrency(a.current_balance)}</option>`).join('');
    document.getElementById('add-modal').classList.add('open');
  }
  function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }

  async function saveAddAmount() {
    const amount = parseFloat(document.getElementById('add-amount').value);
    const accountId = document.getElementById('add-account').value;
    const date = document.getElementById('add-date').value;
    if (!amount || amount<=0) { Utils.toast('Digite um valor','error'); return; }
    if (!accountId) { Utils.toast('Selecione a conta','error'); return; }
    const btn = document.getElementById('add-btn'); btn.disabled=true; btn.textContent='Guardando...';
    const res = await API.call('goals.addContribution', { goal_id: selectedGoal, account_id: accountId, amount, date });
    btn.disabled=false; btn.textContent='💰 Guardar';
    if (res.success) {
      Utils.toast(res.data?.status==='completed' ? '🎉 Meta concluída!' : '💰 Dinheiro guardado!');
      closeAddModal();
      await load();
      if (addFromDetail && selectedGoal) openDetail(selectedGoal);
    } else Utils.toast(res.error||'Erro','error');
  }

  load();
</script>
</body>
</html>
