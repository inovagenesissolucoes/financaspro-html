<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page pt-safe">

  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
    <div>
      <p class="text-xs text-muted">Olá, <span id="user-name"></span> 👋</p>
      <h1>Resumo Financeiro</h1>
    </div>
    <button onclick="Auth.logout()" class="btn-ghost btn btn-sm" style="width:auto;">Sair</button>
  </div>

  <!-- Month nav -->
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="month-label"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <!-- Content -->
  <div id="content">
    <div class="skeleton"></div>
    <div class="skeleton" style="height:80px"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw new Error('redirect');
  renderNav('dashboard.html');
  Utils.setUserName();

  let month = Utils.getActiveMonth();

  function changeMonth(delta) {
    month = Utils.addMonths(month, delta);
    Utils.setActiveMonth(month);
    loadDashboard();
  }

  async function loadDashboard() {
    document.getElementById('month-label').textContent = Utils.formatMonth(month);

    const [sumRes, catRes] = await Promise.all([
      API.getDashboard(month),
      API.getCategoryBreakdown(month)
    ]);

    if (!sumRes.success) {
      document.getElementById('content').innerHTML = `<p class="text-muted text-center">Erro ao carregar dados.</p>`;
      return;
    }

    const s = sumRes.data;
    const cats = catRes.success ? catRes.data : [];
    const healthColor = s.health_score > 60 ? 'var(--green)' : s.health_score > 30 ? 'var(--yellow)' : 'var(--red)';

    document.getElementById('content').innerHTML = `
      <!-- Hero card -->
      <div class="hero-card mb-4">
        <p class="text-xs" style="color:rgba(255,255,255,0.65); margin-bottom:4px;">Saldo Total</p>
        <p class="text-3xl font-bold" style="color:#fff; margin-bottom:12px;">${Utils.formatCurrency(s.total_balance)}</p>
        <div class="flex gap-4">
          <div>
            <p class="text-xs" style="color:rgba(255,255,255,0.6);">Saúde Financeira</p>
            <p class="font-semibold" style="color:#fff;">${s.health_score}%</p>
          </div>
          <div>
            <p class="text-xs" style="color:rgba(255,255,255,0.6);">Renda Comprometida</p>
            <p class="font-semibold" style="color:#fff;">${s.commitment_rate}%</p>
          </div>
        </div>
      </div>

      <!-- 4 summary cards -->
      <div class="grid-2 mb-4">
        <div class="card">
          <p class="text-xs text-muted mb-2">📥 A Receber</p>
          <p class="font-bold text-lg text-green">${Utils.formatCurrency(s.income.pending)}</p>
        </div>
        <div class="card">
          <p class="text-xs text-muted mb-2">📤 A Pagar</p>
          <p class="font-bold text-lg text-red">${Utils.formatCurrency(s.expense.pending)}</p>
        </div>
        <div class="card">
          <p class="text-xs text-muted mb-2">✅ Já Recebi</p>
          <p class="font-bold text-lg text-accent">${Utils.formatCurrency(s.income.paid)}</p>
        </div>
        <div class="card">
          <p class="text-xs text-muted mb-2">💸 Já Paguei</p>
          <p class="font-bold text-lg text-yellow">${Utils.formatCurrency(s.expense.paid)}</p>
        </div>
      </div>

      ${s.overdue_count > 0 ? `
        <div class="alert alert-danger mb-4">
          <span style="font-size:1.5rem;">⚠️</span>
          <div>
            <p class="font-semibold text-sm" style="color:#FCA5A5;">${s.overdue_count} conta${s.overdue_count > 1 ? 's' : ''} vencida${s.overdue_count > 1 ? 's' : ''}</p>
            <p class="text-xs" style="color:#F87171;">${Utils.formatCurrency(s.overdue_amount)} em atraso</p>
          </div>
        </div>
      ` : ''}

      <!-- Contas -->
      ${s.accounts && s.accounts.length > 0 ? `
        <div class="card mb-4">
          <p class="font-semibold text-sm mb-3">🏦 Minhas Contas</p>
          ${s.accounts.map(a => `
            <div class="flex items-center justify-between" style="margin-bottom:10px;">
              <div class="flex items-center gap-2">
                <div style="width:10px;height:10px;border-radius:50%;background:${a.color || 'var(--accent)'}"></div>
                <span class="text-sm">${a.name}</span>
              </div>
              <span class="font-semibold text-sm" style="color:${Number(a.current_balance) >= 0 ? 'var(--green)' : 'var(--red)'}">
                ${Utils.formatCurrency(a.current_balance)}
              </span>
            </div>
          `).join('')}
        </div>
      ` : ''}

      <!-- Category breakdown -->
      ${cats.length > 0 ? `
        <div class="card mb-4">
          <p class="font-semibold text-sm mb-3">🍩 Gastos por Categoria</p>
          <div class="donut-wrap">
            <canvas id="donut-chart" width="110" height="110" style="flex-shrink:0;"></canvas>
            <div class="donut-legend">
              ${cats.slice(0, 5).map(c => `
                <div class="legend-item">
                  <div class="legend-dot" style="background:${c.color}"></div>
                  <span class="legend-name">${c.name}</span>
                  <span class="legend-val">${Utils.formatCurrency(c.total)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      ` : ''}

      <!-- Saldo do mês -->
      <div class="card">
        <p class="font-semibold text-sm mb-3">📈 Balanço do Mês</p>
        <div class="flex justify-between mb-2">
          <span class="text-sm text-muted">Receitas previstas</span>
          <span class="font-medium text-green">${Utils.formatCurrency(s.income.expected)}</span>
        </div>
        <div class="flex justify-between mb-2">
          <span class="text-sm text-muted">Despesas previstas</span>
          <span class="font-medium text-red">${Utils.formatCurrency(s.expense.expected)}</span>
        </div>
        <div style="border-top:1px solid var(--border); padding-top:10px; margin-top:6px;" class="flex justify-between">
          <span class="text-sm font-semibold">Saldo previsto</span>
          <span class="font-bold" style="color:${s.net >= 0 ? 'var(--green)' : 'var(--red)'}">
            ${Utils.formatCurrency(s.net)}
          </span>
        </div>
      </div>
    `;

    // Draw donut chart
    if (cats.length > 0) {
      drawDonut('donut-chart', cats.slice(0, 6));
    }
  }

  function drawDonut(canvasId, data) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const total = data.reduce((s, d) => s + d.total, 0);
    const cx = 55, cy = 55, r = 42, innerR = 26;
    let angle = -Math.PI / 2;

    ctx.clearRect(0, 0, 110, 110);
    data.forEach(d => {
      const slice = (d.total / total) * 2 * Math.PI;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, angle, angle + slice);
      ctx.closePath();
      ctx.fillStyle = d.color || '#6366F1';
      ctx.fill();
      angle += slice;
    });

    // Inner circle (donut hole)
    ctx.beginPath();
    ctx.arc(cx, cy, innerR, 0, 2 * Math.PI);
    ctx.fillStyle = '#1E293B';
    ctx.fill();
  }

  loadDashboard();
</script>
</body>
</html>
