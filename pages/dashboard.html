<!DOCTYPE html>
<html lang="pt-BR"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Dashboard</title>
  <!-- ===== PWA (colar dentro do <head> de CADA página: index.html, recover.html e tudo em /pages) ===== -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinançasPRO">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }
</script>
<!-- ===== fim PWA ===== -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="hero-top">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
        <div>
          <p class="hero-greeting">Boa tarde,</p>
          <p class="hero-name" id="user-name">...</p>
        </div>
      </div>
      <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>
    <p class="hero-bal-label">Saldo total em contas</p>
    <p class="hero-bal" id="total-balance">R$ 0,00</p>
    <p class="hero-sub" id="hero-sub">Carregando...</p>
    <div class="hero-pills">
      <div class="hpill"><div class="hpill-lbl">A receber</div><div class="hpill-val pos" id="income-pending">R$ 0</div></div>
      <div class="hpill"><div class="hpill-lbl">A pagar</div><div class="hpill-val neg" id="expense-pending">R$ 0</div></div>
      <div class="hpill"><div class="hpill-lbl">Comprometido</div><div class="hpill-val" id="commitment-rate">0%</div></div>
    </div>
  </div>

  <div class="stat-grid">
    <div class="scard scard-3"><div class="scard-icon">✅</div><div class="scard-lbl">Já recebi</div><div class="scard-val" id="income-paid">R$ 0</div></div>
    <div class="scard scard-2"><div class="scard-icon">💸</div><div class="scard-lbl">Já paguei</div><div class="scard-val" id="expense-paid">R$ 0</div></div>
    <div class="scard scard-1"><div class="scard-icon">📈</div><div class="scard-lbl">Saldo previsto</div><div class="scard-val" id="net-balance">R$ 0</div></div>
    <div class="scard scard-4"><div class="scard-icon">⚠️</div><div class="scard-lbl">Vencidas</div><div class="scard-val" id="overdue-count">0</div></div>
  </div>

  <div id="overdue-alert"></div>

  <div class="sec">
    <div class="sec-hdr"><span class="sec-title">🏦 Minhas Contas</span><a href="settings.html" class="sec-link">Gerenciar →</a></div>
    <div class="acc-scroll" id="accounts-list"><div class="skeleton" style="min-width:110px;height:90px;"></div></div>
  </div>

  <div class="divider"></div>

  <div class="sec sec-last">
    <div class="sec-hdr"><span class="sec-title">📊 Maiores Gastos</span><a href="transactions.html" class="sec-link">Ver todos →</a></div>
    <div class="cat-list" id="cat-list"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab on"><i class="ti ti-home"></i><span>Início</span><span class="ndot"></span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="window.location.href='transactions.html#new'"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab"><i class="ti ti-credit-card"></i><span>Cartões</span></a>
    <a href="goals.html" class="ntab"><i class="ti ti-target"></i><span>Metas</span></a>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('dashboard.html');

  const COLORS = ['#4F46E5','#D97706','#DC2626','#16A34A','#0EA5E9','#EC4899','#F97316'];
  const typeLabel = {checking:'Conta corrente',savings:'Poupança',wallet:'Carteira',investment:'Investimento',other:'Conta'};

  function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = Math.max(0, Math.min(255, parseInt(R * (100 + percent) / 100)));
    G = Math.max(0, Math.min(255, parseInt(G * (100 + percent) / 100)));
    B = Math.max(0, Math.min(255, parseInt(B * (100 + percent) / 100)));
    return '#' + R.toString(16).padStart(2,'0') + G.toString(16).padStart(2,'0') + B.toString(16).padStart(2,'0');
  }

  async function autoGenerateRecurrences() {
    const key = 'fp_generated_' + Utils.currentMonth();
    if (localStorage.getItem(key)) return;
    const res = await API.generateMonth(Utils.currentMonth());
    if (res.success) {
      const count = res.data?.count || 0;
      if (count > 0) Utils.toast(`🔄 ${count} recorrência(s) gerada(s)!`);
    }
    localStorage.setItem(key, '1');
  }

  async function load() {
    try {
      const user = Auth.getUser();
      document.getElementById('user-name').textContent = (user?.name?.split(' ')[0]||'') + ' 👋';

      const currentMonth = Utils.currentMonth();
      document.getElementById('hero-sub').textContent = Utils.formatMonth(currentMonth);

      autoGenerateRecurrences();

      const [sumRes, catRes] = await Promise.all([
        API.getDashboard(currentMonth),
        API.getCategoryBreakdown(currentMonth)
      ]);

      if (!sumRes.success) return;
      const s = sumRes.data;

      document.getElementById('total-balance').textContent   = Utils.formatCurrency(s.total_balance);
      document.getElementById('income-pending').textContent  = Utils.formatCurrency(s.income.pending);
      document.getElementById('expense-pending').textContent = Utils.formatCurrency(s.expense.pending);
      document.getElementById('commitment-rate').textContent = s.commitment_rate + '%';
      document.getElementById('income-paid').textContent     = Utils.formatCurrency(s.income.paid);
      document.getElementById('expense-paid').textContent    = Utils.formatCurrency(s.expense.paid);

      // Saldo previsto = Recebido - (A pagar + Pago)
      const saldoPrevisto = s.income.paid - (s.expense.pending + s.expense.paid);
      document.getElementById('net-balance').textContent = Utils.formatCurrency(saldoPrevisto);
      document.getElementById('overdue-count').textContent = s.overdue_count + (s.overdue_count===1?' conta':' contas');

      if (s.overdue_count > 0) {
        document.getElementById('overdue-alert').innerHTML = `
          <div class="alert-banner alert-danger">
            <span class="alert-icon">🚨</span>
            <div>
              <div class="alert-title">${s.overdue_count} conta${s.overdue_count>1?'s':''} vencida${s.overdue_count>1?'s':''}</div>
              <div class="alert-sub">${Utils.formatCurrency(s.overdue_amount)} em atraso</div>
            </div>
          </div>`;
      } else {
        document.getElementById('overdue-alert').innerHTML = '';
      }

      if (s.accounts?.length > 0) {
        document.getElementById('accounts-list').innerHTML = s.accounts.map((a) => {
          const color = a.color || '#6366F1';
          return `
          <div class="acc-card" style="background:linear-gradient(135deg, ${color}, ${shadeColor(color,-22)});">
            <div class="acc-emoji">🏦</div>
            <div class="acc-name">${a.name}</div>
            <div class="acc-type">${typeLabel[a.type]||'Conta'}</div>
            <div class="acc-bal">${Utils.formatCurrency(a.current_balance)}</div>
          </div>`;
        }).join('');
      } else {
        document.getElementById('accounts-list').innerHTML = '<p style="font-size:12px;color:var(--text-3);padding:8px 0;">Nenhuma conta. <a href="settings.html" style="color:var(--accent-2);">Cadastrar →</a></p>';
      }

      const cats = catRes.success ? catRes.data : [];
      if (cats.length > 0) {
        const max = cats[0].total || 1;
        document.getElementById('cat-list').innerHTML = cats.slice(0,5).map((c,i) => `
          <div class="cat-row">
            <div class="cat-icon" style="background:${c.color||COLORS[i%COLORS.length]}22;">${c.icon||'💰'}</div>
            <div class="cat-body">
              <div class="cat-top">
                <span class="cat-name">${c.name}</span>
                <span class="cat-amt" style="color:${c.color||COLORS[i%COLORS.length]}">${Utils.formatCurrency(c.total)}</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.round((c.total/max)*100)}%;background:${c.color||COLORS[i%COLORS.length]};"></div></div>
            </div>
          </div>`).join('');
      } else {
        document.getElementById('cat-list').innerHTML = '<p style="font-size:12px;color:var(--text-3);">Sem lançamentos este mês.</p>';
      }

    } catch(e) {
      console.error('ERRO no load:', e);
    }
  }

  load();
</script>
</body>
</html>
