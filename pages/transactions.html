<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Lançamentos</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row">
      <div style="display:flex;align-items:center;gap:10px;">
        <a href="dashboard.html" class="back-btn">‹</a>
        <div>
          <h1 class="page-hero-title">Lançamentos</h1>
          <p class="page-hero-sub" id="month-label"></p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="changeMonth(-1)" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer;">‹</button>
        <button onclick="changeMonth(1)"  style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer;">›</button>
        <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
      </div>
    </div>
    <div class="page-hero-pills">
      <div class="ph-pill"><div class="ph-pill-lbl">Receitas</div><div class="ph-pill-val pos" id="ph-income">R$ 0</div></div>
      <div class="ph-pill"><div class="ph-pill-lbl">Despesas</div><div class="ph-pill-val neg" id="ph-expense">R$ 0</div></div>
      <div class="ph-pill"><div class="ph-pill-lbl">Saldo</div><div class="ph-pill-val" id="ph-net">R$ 0</div></div>
    </div>
  </div>

  <div style="display:flex;gap:5px;padding:12px 14px 8px;overflow-x:auto;" class="no-scrollbar">
    <button class="tab tab-all" style="white-space:nowrap;flex-shrink:0;" onclick="setTab('all',this)">Todos</button>
    <button class="tab tab-income" style="white-space:nowrap;flex-shrink:0;" onclick="setTab('income',this)">Receitas</button>
    <button class="tab tab-expense" style="white-space:nowrap;flex-shrink:0;" onclick="setTab('expense',this)">Despesas</button>
    <button class="tab" style="white-space:nowrap;flex-shrink:0;background:var(--accent-light);color:var(--accent-2);" onclick="setTab('recurring',this)">🔄 Recorrentes</button>
    <button class="tab" style="white-space:nowrap;flex-shrink:0;background:var(--red-bg);color:var(--red);" onclick="setTab('overdue',this)">⚠ Vencidas</button>
  </div>

  <div id="list-container">
    <div style="padding:0 14px;"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>

</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab on"><i class="ti ti-list"></i><span>Lançamentos</span><span class="ndot"></span></a>
    <div class="ncenter"><button class="fab-nav" onclick="openTypeSelector()"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab"><i class="ti ti-credit-card"></i><span>Cartões</span></a>
    <a href="goals.html" class="ntab"><i class="ti ti-target"></i><span>Metas</span></a>
  </div>
</div>

<!-- Type selector -->
<div class="modal-overlay" id="type-selector" onclick="if(event.target===this)closeTypeSelector()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">O que deseja lançar?</span><button class="modal-close" onclick="closeTypeSelector()">✕</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button onclick="openModal('expense')" style="padding:18px 12px;border-radius:var(--radius);border:1.5px solid var(--red-bg);background:var(--red-bg);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;">
        <span style="font-size:28px;">📤</span><span style="font-size:12px;font-weight:700;color:var(--red);">Despesa</span><span style="font-size:10px;color:var(--text-3);">Gasto avulso</span>
      </button>
      <button onclick="openModal('income')" style="padding:18px 12px;border-radius:var(--radius);border:1.5px solid var(--green-bg);background:var(--green-bg);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;">
        <span style="font-size:28px;">📥</span><span style="font-size:12px;font-weight:700;color:var(--green);">Receita</span><span style="font-size:10px;color:var(--text-3);">Entrada avulsa</span>
      </button>
      <button onclick="openCardModal()" style="padding:18px 12px;border-radius:var(--radius);border:1.5px solid var(--accent-light);background:var(--accent-light);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;">
        <span style="font-size:28px;">💳</span><span style="font-size:12px;font-weight:700;color:var(--accent-2);">Cartão</span><span style="font-size:10px;color:var(--text-3);">Compra no crédito</span>
      </button>
      <button onclick="openTransferModal()" style="padding:18px 12px;border-radius:var(--radius);border:1.5px solid #FEF3C7;background:#FEF3C7;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;">
        <span style="font-size:28px;">🔃</span><span style="font-size:12px;font-weight:700;color:#D97706;">Transferência</span><span style="font-size:10px;color:var(--text-3);">Entre contas</span>
      </button>
      <button onclick="openRecurrenceModal()" style="padding:18px 12px;border-radius:var(--radius);border:1.5px solid #E0E7FF;background:#E0E7FF;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;">
        <span style="font-size:28px;">🔄</span><span style="font-size:12px;font-weight:700;color:#4338CA;">Recorrência</span><span style="font-size:10px;color:var(--text-3);">Fixa mensal</span>
      </button>
      <button onclick="openDebtModal()" style="padding:18px 12px;border-radius:var(--radius);border:1.5px solid #FFE4E6;background:#FFE4E6;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;">
        <span style="font-size:28px;">📌</span><span style="font-size:12px;font-weight:700;color:#BE123C;">Parcelamento</span><span style="font-size:10px;color:var(--text-3);">Dívida em parcelas</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal despesa/receita -->
<div class="modal-overlay" id="tx-modal" onclick="if(event.target===this)closeTxModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title" id="tx-modal-title">Nova Despesa</span><button class="modal-close" onclick="closeTxModal()">✕</button></div>
    <div class="field"><label class="field-label">Descrição *</label><input type="text" id="tx-desc" placeholder="Ex: Mercado, Salário..."></div>
    <div class="field"><label class="field-label">Valor (R$) *</label><input type="number" id="tx-amount" placeholder="0,00" step="0.01" min="0"></div>
    <div class="field"><label class="field-label">Data *</label><input type="date" id="tx-date"></div>
    <div class="field"><label class="field-label">Categoria</label><select id="tx-category"><option value="">Sem categoria</option></select></div>
    <div class="field"><label class="field-label">Conta</label><select id="tx-account"><option value="">Sem conta</option></select></div>
    <div class="field"><label class="field-label">Observações</label><input type="text" id="tx-notes" placeholder="Opcional"></div>
    <button class="btn btn-primary" id="tx-save-btn" onclick="saveTransaction()">Salvar</button>
  </div>
</div>

<!-- Modal compra cartão -->
<div class="modal-overlay" id="card-modal" onclick="if(event.target===this)closeCardModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Compra no Cartão</span><button class="modal-close" onclick="closeCardModal()">✕</button></div>
    <div class="field"><label class="field-label">Descrição *</label><input type="text" id="cm-desc" placeholder="Ex: Supermercado, Roupa..."></div>
    <div class="field"><label class="field-label">Valor (R$) *</label><input type="number" id="cm-amount" placeholder="0,00" step="0.01"></div>
    <div class="field"><label class="field-label">Data da compra *</label><input type="date" id="cm-date"></div>
    <div class="field"><label class="field-label">Cartão *</label><select id="cm-card"><option value="">Selecione o cartão</option></select></div>
    <div class="field"><label class="field-label">Categoria</label><select id="cm-category"><option value="">Sem categoria</option></select></div>
    <button class="btn btn-primary" id="cm-save-btn" onclick="saveCardPurchase()">Registrar Compra</button>
  </div>
</div>

<!-- Modal transferência -->
<div class="modal-overlay" id="transfer-modal" onclick="if(event.target===this)closeTransferModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Transferência entre Contas</span><button class="modal-close" onclick="closeTransferModal()">✕</button></div>
    <div class="field"><label class="field-label">Valor (R$) *</label><input type="number" id="tr-amount" placeholder="0,00" step="0.01"></div>
    <div class="field"><label class="field-label">Data *</label><input type="date" id="tr-date"></div>
    <div class="field"><label class="field-label">Conta de origem *</label><select id="tr-from"><option value="">Selecione</option></select></div>
    <div class="field"><label class="field-label">Conta de destino *</label><select id="tr-to"><option value="">Selecione</option></select></div>
    <div class="field"><label class="field-label">Observações</label><input type="text" id="tr-notes" placeholder="Opcional"></div>
    <button class="btn btn-primary" id="tr-save-btn" onclick="saveTransfer()">Transferir</button>
  </div>
</div>

<!-- Modal recorrência -->
<div class="modal-overlay" id="rec-modal" onclick="if(event.target===this)closeRecurrenceModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Nova Recorrência</span><button class="modal-close" onclick="closeRecurrenceModal()">✕</button></div>
    <div class="type-toggle">
      <button class="type-btn expense active" id="rec-btn-expense" onclick="setRecType('expense')">📤 Despesa</button>
      <button class="type-btn income" id="rec-btn-income" onclick="setRecType('income')">📥 Receita</button>
    </div>
    <div class="field"><label class="field-label">Descrição *</label><input type="text" id="rec-desc" placeholder="Ex: Aluguel, Salário, Netflix..."></div>
    <div class="field"><label class="field-label">Valor (R$) *</label><input type="number" id="rec-amount" placeholder="0,00" step="0.01"></div>
    <div class="field"><label class="field-label">Dia do mês *</label><input type="number" id="rec-day" placeholder="Ex: 5 = todo dia 5" min="1" max="31"></div>
    <div class="field"><label class="field-label">Categoria</label><select id="rec-category"><option value="">Sem categoria</option></select></div>
    <div class="field"><label class="field-label">Conta</label><select id="rec-account"><option value="">Sem conta</option></select></div>
    <button class="btn btn-primary" id="rec-save-btn" onclick="saveRecurrence()">Salvar Recorrência</button>
  </div>
</div>

<!-- Modal parcelamento -->
<div class="modal-overlay" id="debt-modal" onclick="if(event.target===this)closeDebtModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Novo Parcelamento</span><button class="modal-close" onclick="closeDebtModal()">✕</button></div>
    <div class="field"><label class="field-label">Descrição *</label><input type="text" id="d-desc" placeholder="Ex: Notebook, Geladeira..."></div>
    <div class="field"><label class="field-label">Valor original do produto (R$)</label><input type="number" id="d-original" placeholder="Quanto custava sem parcelar" step="0.01" oninput="calcDebtPreview()"></div>
    <div class="grid-2">
      <div class="field"><label class="field-label">Nº de parcelas *</label><input type="number" id="d-total" placeholder="12" min="1" oninput="calcDebtPreview()"></div>
      <div class="field"><label class="field-label">Valor por parcela *</label><input type="number" id="d-install" placeholder="0,00" step="0.01" oninput="calcDebtPreview()"></div>
    </div>
    <div class="field"><label class="field-label">Data da 1ª parcela *</label><input type="date" id="d-date"></div>
    <div class="field"><label class="field-label">Conta / Cartão</label><select id="d-account"><option value="">Sem conta</option></select></div>
    <div class="field"><label class="field-label">Categoria</label><select id="d-category"><option value="">Sem categoria</option></select></div>

    <div id="debt-preview" style="display:none;background:var(--bg-input);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:11px;color:var(--text-3);">Total a pagar:</span>
        <span style="font-size:12px;font-weight:700;" id="prev-total"></span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;" id="prev-interest-row">
        <span style="font-size:11px;color:var(--text-3);">Valor original:</span>
        <span style="font-size:12px;font-weight:700;" id="prev-original"></span>
      </div>
      <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:0.5px solid var(--border);" id="prev-juros-row">
        <span style="font-size:11px;font-weight:700;color:var(--yellow);">💸 Juros que vai pagar:</span>
        <span style="font-size:13px;font-weight:700;color:var(--yellow);" id="prev-juros"></span>
      </div>
    </div>

    <button class="btn btn-primary" id="d-save-btn" onclick="saveDebt()">Criar Parcelas</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('transactions.html');

  let month = Utils.getActiveMonth();
  let activeTab = 'all';
  let allTx = [], categories = [], accounts = [], cards = [];
  let txType = 'expense', recType = 'expense';

  function changeMonth(d) { month = Utils.addMonths(month, d); Utils.setActiveMonth(month); load(); }

  function setTab(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('tab-all','tab-income','tab-expense');
      t.style.background = 'var(--bg-card)';
      t.style.color = 'var(--text-3)';
    });
    if (tab==='all') el.classList.add('tab-all');
    else if (tab==='income') el.classList.add('tab-income');
    else if (tab==='expense') el.classList.add('tab-expense');
    else if (tab==='recurring') { el.style.background='var(--accent-light)'; el.style.color='var(--accent-2)'; }
    else if (tab==='overdue')   { el.style.background='var(--red-bg)'; el.style.color='var(--red)'; }
    renderList();
  }

  async function load() {
    document.getElementById('month-label').textContent = Utils.formatMonth(month);
    document.getElementById('list-container').innerHTML = '<div style="padding:0 14px;"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
    const [txRes, catRes, accRes, cardRes] = await Promise.all([API.listTransactions({month}), API.listCategories(), API.listAccounts(), API.listCards()]);
    allTx      = txRes.success  ? txRes.data  : [];
    categories = catRes.success ? catRes.data : [];
    accounts   = accRes.success ? accRes.data : [];
    cards      = cardRes.success ? cardRes.data : [];
    const income  = allTx.filter(t=>t.type==='income'&&t.status!=='cancelled');
    const expense = allTx.filter(t=>t.type==='expense'&&t.status!=='cancelled');
    const totalIn  = income.reduce((s,t)=>s+Number(t.expected_amount||0),0);
    const totalExp = expense.reduce((s,t)=>s+Number(t.expected_amount||0),0);
    document.getElementById('ph-income').textContent  = Utils.formatCurrency(totalIn);
    document.getElementById('ph-expense').textContent = Utils.formatCurrency(totalExp);
    document.getElementById('ph-net').textContent     = Utils.formatCurrency(totalIn - totalExp);
    renderList();
  }

  function renderList() {
    let filtered = allTx.filter(t=>t.status!=='cancelled');
    if (activeTab==='income')    filtered = filtered.filter(t=>t.type==='income');
    else if (activeTab==='expense')   filtered = filtered.filter(t=>t.type==='expense');
    else if (activeTab==='recurring') filtered = filtered.filter(t=>t.is_recurring==true||t.is_recurring==='TRUE');
    else if (activeTab==='overdue')   filtered = filtered.filter(t=>Utils.isOverdue(t.due_date,t.status));

    if (filtered.length===0) {
      document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p class="empty-text">Nenhum lançamento encontrado</p><button class="btn btn-primary" style="max-width:200px;margin:0 auto;" onclick="openTypeSelector()">Adicionar</button></div>`;
      return;
    }

    const paid    = filtered.filter(t=>t.status==='paid');
    const overdue = filtered.filter(t=>t.status!=='paid'&&Utils.isOverdue(t.due_date,t.status));
    const pending = filtered.filter(t=>t.status!=='paid'&&!Utils.isOverdue(t.due_date,t.status));
    let html = '';
    if (overdue.length>0) html += `<div class="date-label">⚠ Vencidas</div><div class="tx-list">${overdue.map(renderCard).join('')}</div>`;
    if (pending.length>0) html += `<div class="date-label">Pendentes</div><div class="tx-list">${pending.map(renderCard).join('')}</div>`;
    if (paid.length>0)    html += `<div class="date-label">✓ Concluídas</div><div class="tx-list">${paid.map(renderCard).join('')}</div>`;
    document.getElementById('list-container').innerHTML = html;
  }

  function renderCard(tx) {
    const overdue = Utils.isOverdue(tx.due_date, tx.status);
    const cat  = categories.find(c=>c.category_id===tx.category_id);
    const acc  = accounts.find(a=>a.account_id===tx.account_id);
    const card = cards.find(c=>c.card_id===tx.card_id);
    const icon = cat?.icon||(tx.card_id?'💳':tx.type==='income'?'💼':'💰');
    const sub  = [cat?.name, acc?.name||card?.name].filter(Boolean).join(' · ');
    const badge = tx.status==='paid'
      ? `<span class="badge b-paid">${tx.type==='income'?'✓ Recebido':'✓ Pago'}</span>`
      : overdue ? '<span class="badge b-over">⚠ Vencida</span>'
      : `<span class="badge b-pend">Vence ${Utils.formatDate(tx.due_date)}</span>`;
    const recTag  = (tx.is_recurring==true||tx.is_recurring==='TRUE') ? '<span class="badge" style="background:var(--accent-light);color:var(--accent-2);margin-left:4px;">🔄</span>' : '';
    const instTag = tx.installment_number ? `<span class="badge" style="background:#FEF3C7;color:#92400E;margin-left:4px;">📌 ${tx.installment_number}ª parc.</span>` : '';
    const amt = tx.status==='paid' ? Number(tx.actual_amount||tx.expected_amount) : Number(tx.expected_amount);
    const payBtn = tx.status==='pending' ? `<button class="pay-btn" onclick="markPaid('${tx.transaction_id}','${tx.account_id||''}',${tx.expected_amount})">${tx.type==='income'?'Confirmar':'Pagar'}</button>` : '';
    return `
      <div class="tx-card ${overdue&&tx.status!=='paid'?'overdue':''}">
        <div class="tx-ico" style="background:${(cat?.color||'#6366F1')}22;">${icon}</div>
        <div class="tx-body">
          <div class="tx-name">${tx.description}</div>
          <div class="tx-cat">${sub}</div>
          <div>${badge}${recTag}${instTag}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amt ${tx.type==='income'?'tx-pos':'tx-neg'}">${tx.type==='income'?'+':'-'}${Utils.formatCurrency(amt)}</div>
          ${payBtn}
        </div>
      </div>`;
  }

  async function markPaid(id, accountId, amount) {
    const res = await API.markPaid({transaction_id:id,account_id:accountId,paid_date:new Date().toISOString().split('T')[0],actual_amount:amount});
    if (res.success) { Utils.toast('✅ Marcado como pago!'); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  function openTypeSelector() { document.getElementById('type-selector').classList.add('open'); }
  function closeTypeSelector() { document.getElementById('type-selector').classList.remove('open'); }

  function openModal(type) {
    closeTypeSelector(); txType = type;
    document.getElementById('tx-modal-title').textContent = type==='income'?'Nova Receita':'Nova Despesa';
    document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('tx-category').innerHTML = '<option value="">Sem categoria</option>' + categories.filter(c=>c.type===type).map(c=>`<option value="${c.category_id}">${c.icon||''} ${c.name}</option>`).join('');
    document.getElementById('tx-account').innerHTML = '<option value="">Sem conta</option>' + accounts.map(a=>`<option value="${a.account_id}">${a.name}</option>`).join('');
    document.getElementById('tx-modal').classList.add('open');
  }
  function closeTxModal() { document.getElementById('tx-modal').classList.remove('open'); }

  async function saveTransaction() {
    const desc=document.getElementById('tx-desc').value.trim(), amount=parseFloat(document.getElementById('tx-amount').value), date=document.getElementById('tx-date').value;
    if (!desc||!amount||!date) { Utils.toast('Preencha descrição, valor e data','error'); return; }
    const btn=document.getElementById('tx-save-btn'); btn.disabled=true; btn.textContent='Salvando...';
    const res=await API.createTransaction({type:txType,description:desc,expected_amount:amount,due_date:date,category_id:document.getElementById('tx-category').value,account_id:document.getElementById('tx-account').value,notes:document.getElementById('tx-notes').value});
    btn.disabled=false; btn.textContent='Salvar';
    if (res.success) { Utils.toast('✅ Salvo!'); closeTxModal(); ['tx-desc','tx-amount','tx-notes'].forEach(id=>document.getElementById(id).value=''); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  function openCardModal() {
    closeTypeSelector();
    document.getElementById('cm-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('cm-card').innerHTML = '<option value="">Selecione o cartão</option>' + cards.map(c=>`<option value="${c.card_id}">${c.name}</option>`).join('');
    document.getElementById('cm-category').innerHTML = '<option value="">Sem categoria</option>' + categories.filter(c=>c.type==='expense').map(c=>`<option value="${c.category_id}">${c.icon||''} ${c.name}</option>`).join('');
    document.getElementById('card-modal').classList.add('open');
  }
  function closeCardModal() { document.getElementById('card-modal').classList.remove('open'); }

  async function saveCardPurchase() {
    const desc=document.getElementById('cm-desc').value.trim(), amount=parseFloat(document.getElementById('cm-amount').value), date=document.getElementById('cm-date').value, cardId=document.getElementById('cm-card').value;
    if (!desc||!amount||!date||!cardId) { Utils.toast('Preencha todos os campos obrigatórios','error'); return; }
    const btn=document.getElementById('cm-save-btn'); btn.disabled=true; btn.textContent='Salvando...';
    const res=await API.createTransaction({type:'expense',description:desc,expected_amount:amount,due_date:date,card_id:cardId,category_id:document.getElementById('cm-category').value});
    btn.disabled=false; btn.textContent='Registrar Compra';
    if (res.success) { Utils.toast('✅ Compra registrada!'); closeCardModal(); ['cm-desc','cm-amount'].forEach(id=>document.getElementById(id).value=''); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  function openTransferModal() {
    closeTypeSelector();
    document.getElementById('tr-date').value = new Date().toISOString().split('T')[0];
    const opts = '<option value="">Selecione</option>' + accounts.map(a=>`<option value="${a.account_id}">${a.name}</option>`).join('');
    document.getElementById('tr-from').innerHTML = opts;
    document.getElementById('tr-to').innerHTML = opts;
    document.getElementById('transfer-modal').classList.add('open');
  }
  function closeTransferModal() { document.getElementById('transfer-modal').classList.remove('open'); }

  async function saveTransfer() {
    const amount=parseFloat(document.getElementById('tr-amount').value), date=document.getElementById('tr-date').value;
    const fromId=document.getElementById('tr-from').value, toId=document.getElementById('tr-to').value;
    if (!amount||!date||!fromId||!toId) { Utils.toast('Preencha todos os campos','error'); return; }
    if (fromId===toId) { Utils.toast('Contas devem ser diferentes','error'); return; }
    const notes=document.getElementById('tr-notes').value;
    const btn=document.getElementById('tr-save-btn'); btn.disabled=true; btn.textContent='Transferindo...';
    const fromName=accounts.find(a=>a.account_id===fromId)?.name||'origem';
    const toName=accounts.find(a=>a.account_id===toId)?.name||'destino';
    const [r1,r2]=await Promise.all([
      API.createTransaction({type:'expense',description:`Transferência → ${toName}`,expected_amount:amount,due_date:date,account_id:fromId,notes}),
      API.createTransaction({type:'income',description:`Transferência ← ${fromName}`,expected_amount:amount,due_date:date,account_id:toId,notes})
    ]);
    btn.disabled=false; btn.textContent='Transferir';
    if (r1.success&&r2.success) {
      await Promise.all([
        API.markPaid({transaction_id:r1.data.transaction_id,account_id:fromId,paid_date:date,actual_amount:amount}),
        API.markPaid({transaction_id:r2.data.transaction_id,account_id:toId,paid_date:date,actual_amount:amount})
      ]);
      Utils.toast('✅ Transferência realizada!'); closeTransferModal(); ['tr-amount','tr-notes'].forEach(id=>document.getElementById(id).value=''); load();
    } else Utils.toast('Erro ao transferir','error');
  }

  function openRecurrenceModal() {
    closeTypeSelector(); setRecType('expense');
    document.getElementById('rec-modal').classList.add('open');
  }
  function closeRecurrenceModal() { document.getElementById('rec-modal').classList.remove('open'); }
  function setRecType(type) {
    recType=type;
    document.getElementById('rec-btn-expense').classList.toggle('active',type==='expense');
    document.getElementById('rec-btn-income').classList.toggle('active',type==='income');
    document.getElementById('rec-category').innerHTML='<option value="">Sem categoria</option>'+categories.filter(c=>c.type===type).map(c=>`<option value="${c.category_id}">${c.icon||''} ${c.name}</option>`).join('');
    document.getElementById('rec-account').innerHTML='<option value="">Sem conta</option>'+accounts.map(a=>`<option value="${a.account_id}">${a.name}</option>`).join('');
  }

  async function saveRecurrence() {
    const desc=document.getElementById('rec-desc').value.trim(), amount=parseFloat(document.getElementById('rec-amount').value), day=parseInt(document.getElementById('rec-day').value);
    if (!desc||!amount||!day) { Utils.toast('Preencha descrição, valor e dia','error'); return; }
    const btn=document.getElementById('rec-save-btn'); btn.disabled=true; btn.textContent='Salvando...';
    const res=await API.createRecurrence({description:desc,type:recType,expected_amount:amount,recurrence_day:day,category_id:document.getElementById('rec-category').value,account_id:document.getElementById('rec-account').value,start_date:new Date().toISOString().split('T')[0]});
    btn.disabled=false; btn.textContent='Salvar Recorrência';
    if (res.success) {
      await API.generateMonth(month);
      Utils.toast('✅ Recorrência salva e lançada no mês!');
      closeRecurrenceModal(); ['rec-desc','rec-amount','rec-day'].forEach(id=>document.getElementById(id).value=''); load();
    } else Utils.toast(res.error||'Erro','error');
  }

  function openDebtModal() {
    closeTypeSelector();
    document.getElementById('d-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('d-account').innerHTML = '<option value="">Sem conta</option>'+accounts.map(a=>`<option value="${a.account_id}">${a.name}</option>`).join('')+cards.map(c=>`<option value="card:${c.card_id}">💳 ${c.name}</option>`).join('');
    document.getElementById('d-category').innerHTML = '<option value="">Sem categoria</option>'+categories.filter(c=>c.type==='expense').map(c=>`<option value="${c.category_id}">${c.icon||''} ${c.name}</option>`).join('');
    document.getElementById('debt-modal').classList.add('open');
  }
  function closeDebtModal() { document.getElementById('debt-modal').classList.remove('open'); }

  function calcDebtPreview() {
    const total=parseFloat(document.getElementById('d-total').value)||0, install=parseFloat(document.getElementById('d-install').value)||0, original=parseFloat(document.getElementById('d-original').value)||0;
    if (total>0&&install>0) {
      const totalPay=total*install, juros=totalPay-original;
      document.getElementById('prev-total').textContent=Utils.formatCurrency(totalPay);
      document.getElementById('prev-original').textContent=Utils.formatCurrency(original);
      document.getElementById('prev-juros').textContent=juros>0?Utils.formatCurrency(juros):'R$ 0,00';
      document.getElementById('debt-preview').style.display='block';
      document.getElementById('prev-interest-row').style.display=original>0?'flex':'none';
      document.getElementById('prev-juros-row').style.display=original>0?'flex':'none';
    } else document.getElementById('debt-preview').style.display='none';
  }

  async function saveDebt() {
    const desc=document.getElementById('d-desc').value.trim(), totalInstall=parseInt(document.getElementById('d-total').value), installAmt=parseFloat(document.getElementById('d-install').value), firstDate=document.getElementById('d-date').value;
    if (!desc||!totalInstall||!installAmt||!firstDate) { Utils.toast('Preencha os campos obrigatórios','error'); return; }
    const accVal=document.getElementById('d-account').value;
    const accountId=accVal.startsWith('card:')?'':accVal, cardId=accVal.startsWith('card:')?accVal.replace('card:',''):'';
    const btn=document.getElementById('d-save-btn'); btn.disabled=true; btn.textContent=`Criando ${totalInstall} parcelas...`;
    const res=await API.createDebt({description:desc,original_amount:parseFloat(document.getElementById('d-original').value)||(totalInstall*installAmt),total_installments:totalInstall,installment_amount:installAmt,first_due_date:firstDate,category_id:document.getElementById('d-category').value,account_id:accountId,card_id:cardId});
    btn.disabled=false; btn.textContent='Criar Parcelas';
    if (res.success) { Utils.toast(`✅ ${totalInstall} parcelas criadas!`); closeDebtModal(); ['d-desc','d-original','d-total','d-install'].forEach(id=>document.getElementById(id).value=''); document.getElementById('debt-preview').style.display='none'; load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  if (window.location.hash==='#new') setTimeout(openTypeSelector,300);
  load();
</script>
</body>
