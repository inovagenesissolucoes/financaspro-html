<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../css/style.css">

</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
        <div>
          <h1 class="page-hero-title">Menu</h1>
          
        </div>
      </div>
    </div>
  </div>


<!-- Bottom nav -->
<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="window.location.href='transactions.html#new'"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab"><i class="ti ti-credit-card"></i><span>Cartões</span></a>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('more.html');
  const user = Auth.getUser();
  if (user) document.getElementById('user-greeting').textContent = `Olá, ${user.name.split(' ')[0]}!`;
