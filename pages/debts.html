<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Dívidas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row" style="gap:10px;">
      <div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;"><a href="dashboard.html" class="back-btn">&#8249;</a><div><h1 class="page-hero-title">Dívidas</h1><p class="page-hero-sub">Parcelamentos ativos</p></div>
    </div>
    <div class="page-hero-pills">
      <div class="ph-pill"><div class="ph-pill-lbl">Total restante</div><div class="ph-pill-val neg" id="total-remaining">R$ 0</div></div>
      <div class="ph-pill"><div class="ph-pill-lbl">Em juros</div><div class="ph-pill-val" style="color:#FCD34D;" id="total-interest">R$ 0</div></div>
      <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
    </div>
  </div>

  <div style="padding:14px 14px 0;" id="plan-btns" style="display:none;">
    <div class="plan-btns">
      <button class="plan-btn plan-avalanche" onclick="loadPlan('avalanche')">🏔 Avalanche</button>
      <button class="plan-btn plan-snowball" onclick="loadPlan('snowball')">⛄ Bola de Neve</button>
    </div>
  </div>

  <div id="plan-container" style="padding:0 14px;"></div>

  <div id="list-container" style="padding:14px;">
    <div class="skeleton"></div><div class="skeleton" style="height:120px;"></div>
  </div>

</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="openModal()"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab"><i class="ti ti-credit-card"></i><span>Cartões</span></a>
    <a href="more.html" class="ntab"><i class="ti ti-dots"></i><span>Mais</span></a>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Nova Dívida Parcelada</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label class="field-label">Descrição *</label><input type="text" id="d-desc" placeholder="Ex: Notebook, Geladeira..."></div>
    <div class="field"><label class="field-label">Valor original do produto (R$)</label><input type="number" id="d-original" placeholder="Quanto custava sem parcelar" step="0.01" oninput="calcPreview()"></div>
    <div class="grid-2">
      <div class="field"><label class="field-label">Nº de parcelas *</label><input type="number" id="d-total" placeholder="12" min="1" oninput="calcPreview()"></div>
      <div class="field"><label class="field-label">Valor por parcela *</label><input type="number" id="d-install" placeholder="0,00" step="0.01" oninput="calcPreview()"></div>
    </div>
    <div class="field"><label class="field-label">Data da 1ª parcela *</label><input type="date" id="d-date"></div>
    <div class="field"><label class="field-label">Categoria</label><select id="d-category"><option value="">Sem categoria</option></select></div>
    <div class="field"><label class="field-label">Conta</label><select id="d-account"><option value="">Sem conta</option></select></div>
    <div id="debt-preview" class="preview-box" style="display:none;">
      <div class="preview-row"><span class="preview-lbl">Total a pagar:</span><span class="preview-val" id="preview-total"></span></div>
      <div class="preview-row" id="preview-interest-row" style="display:none;"><span class="preview-lbl">Juros estimados:</span><span class="preview-val text-yellow" id="preview-interest"></span></div>
    </div>
    <button class="btn btn-primary" id="save-btn" onclick="saveDebt()">Criar Parcelas</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('debts.html');

  let categories = [], accounts = [];

  async function load() {
    const [debtsRes, catRes, accRes] = await Promise.all([API.listDebts(), API.listCategories(), API.listAccounts()]);
    categories = catRes.success ? catRes.data : [];
    accounts = accRes.success ? accRes.data : [];
    const catSel = document.getElementById('d-category');
    const accSel = document.getElementById('d-account');
    catSel.innerHTML = '<option value="">Sem categoria</option>' + categories.filter(c=>c.type==='expense').map(c=>`<option value="${c.category_id}">${c.icon||''} ${c.name}</option>`).join('');
    accSel.innerHTML = '<option value="">Sem conta</option>' + accounts.map(a=>`<option value="${a.account_id}">${a.name}</option>`).join('');

    const debts = debtsRes.success ? debtsRes.data : [];
    const totalRemaining = debts.reduce((s,d)=>s+Number(d.remaining_amount||0),0);
    const totalInterest = debts.reduce((s,d)=>s+Number(d.interest_amount||0),0);
    document.getElementById('total-remaining').textContent = Utils.formatCurrency(totalRemaining);
    document.getElementById('total-interest').textContent = Utils.formatCurrency(totalInterest);

    if (debts.length > 0) document.getElementById('plan-btns').style.display = 'block';

    if (debts.length === 0) {
      document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="empty-icon">🎉</div><p class="empty-text">Sem dívidas parceladas!</p><button class="btn btn-primary" style="max-width:200px;margin:0 auto;" onclick="openModal()">Cadastrar dívida</button></div>`;
      return;
    }

    document.getElementById('list-container').innerHTML = debts.map(d => {
      const paid = Number(d.paid_installments)||0;
      const total = Number(d.total_installments)||1;
      const pct = Math.min(100, Math.round((paid/total)*100));
      return `
        <div class="dcard">
          <div class="dcard-top">
            <div><div class="dcard-name">${d.description}</div><div class="dcard-sub">${paid}/${total} parcelas pagas</div></div>
            <div style="text-align:right;"><div class="dcard-amt">${Utils.formatCurrency(d.remaining_amount)}</div><div class="dcard-lbl">restante</div></div>
          </div>
          <div class="prog"><div class="prog-fill" style="width:${pct}%;"></div></div>
          <div class="dcard-footer">
            <span class="dcard-info">Parcela: ${Utils.formatCurrency(d.installment_amount)}</span>
            <span class="dcard-info">Juros: ${Utils.formatCurrency(d.interest_amount)}</span>
            ${d.next_due_date ? `<span class="dcard-info">Próxima: ${Utils.formatDate(d.next_due_date)}</span>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  async function loadPlan(strategy) {
    document.getElementById('plan-container').innerHTML = '<div style="padding:0 0 10px;"><div class="skeleton"></div></div>';
    const res = await API.getDebtPlan(strategy);
    if (!res.success) { document.getElementById('plan-container').innerHTML = ''; return; }
    const { plan } = res.data;
    const label = strategy === 'avalanche' ? '🏔 Avalanche — maiores juros primeiro' : '⛄ Bola de Neve — menor saldo primeiro';
    const tip = strategy === 'avalanche' ? 'Você pagará menos juros no total.' : 'Você eliminará dívidas mais rápido.';
    document.getElementById('plan-container').innerHTML = `
      <div class="dcard" style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span class="dcard-name">${label}</span>
          <button onclick="document.getElementById('plan-container').innerHTML=''" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:1rem;">✕</button>
        </div>
        <p style="font-size:11px;color:var(--text-3);margin-bottom:12px;">${tip}</p>
        ${plan.map((d,i)=>`
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <div style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:${i===0?'#4F46E5':'var(--bg-input)'};color:${i===0?'#fff':'var(--text-2)'};">${i+1}</div>
            <div style="flex:1;min-width:0;"><p style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.description}</p><p style="font-size:10px;color:var(--text-3);">${Utils.formatCurrency(d.remaining_amount)} restante</p></div>
            ${i===0?`<span style="background:#4F46E5;color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0;">Prioridade</span>`:''}
          </div>`).join('')}
      </div>`;
  }

  function calcPreview() {
    const total = parseFloat(document.getElementById('d-total').value)||0;
    const install = parseFloat(document.getElementById('d-install').value)||0;
    const original = parseFloat(document.getElementById('d-original').value)||0;
    if (total > 0 && install > 0) {
      const totalPay = total * install;
      const interest = totalPay - original;
      document.getElementById('preview-total').textContent = Utils.formatCurrency(totalPay);
      document.getElementById('debt-preview').style.display = 'block';
      const irow = document.getElementById('preview-interest-row');
      if (original > 0 && interest > 0.01) { document.getElementById('preview-interest').textContent = Utils.formatCurrency(interest); irow.style.display = 'flex'; }
      else irow.style.display = 'none';
    } else document.getElementById('debt-preview').style.display = 'none';
  }

  function openModal() { document.getElementById('d-date').value = new Date().toISOString().split('T')[0]; document.getElementById('modal-overlay').classList.add('open'); }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  async function saveDebt() {
    const desc = document.getElementById('d-desc').value.trim();
    const totalInstall = parseInt(document.getElementById('d-total').value);
    const installAmt = parseFloat(document.getElementById('d-install').value);
    const firstDate = document.getElementById('d-date').value;
    if (!desc || !totalInstall || !installAmt || !firstDate) { Utils.toast('Preencha os campos obrigatórios','error'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = `Criando ${totalInstall} parcelas...`;
    const res = await API.createDebt({ description:desc, original_amount:parseFloat(document.getElementById('d-original').value)||(totalInstall*installAmt), total_installments:totalInstall, installment_amount:installAmt, first_due_date:firstDate, category_id:document.getElementById('d-category').value, account_id:document.getElementById('d-account').value });
    btn.disabled = false; btn.textContent = 'Criar Parcelas';
    if (res.success) { Utils.toast(`✅ ${totalInstall} parcelas criadas!`); closeModal(); ['d-desc','d-original','d-total','d-install'].forEach(id=>document.getElementById(id).value=''); document.getElementById('debt-preview').style.display='none'; load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  load();
</script>
</body>
</html>
