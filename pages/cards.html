<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Cartões</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    .preset-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
    .preset-card { padding:10px 6px; border-radius:10px; cursor:pointer; border:2px solid transparent; text-align:center; transition:transform 0.15s; }
    .preset-card:hover { transform:scale(1.05); }
    .preset-card.active { border-color:#fff; box-shadow:0 0 0 2px var(--accent-2); }
    .preset-card span { font-size:10px; font-weight:700; color:#fff; }
    .summary-card { background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-radius:16px; padding:18px; margin:14px 14px 18px; color:#fff; }
    .summary-row { display:flex; justify-content:space-between; margin-bottom:10px; }
    .summary-lbl { font-size:11px; opacity:0.85; }
    .summary-val { font-size:14px; font-weight:700; }
    .summary-total { font-size:22px; font-weight:800; margin-bottom:4px; }
    .summary-bar { height:6px; background:rgba(255,255,255,0.2); border-radius:3px; overflow:hidden; margin-top:8px; }
    .summary-bar-fill { height:100%; background:#fff; transition:width 0.4s; }
    .cccard-real { padding:18px; border-radius:16px; color:#fff; margin-bottom:14px; cursor:pointer; transition:transform 0.15s; }
    .cccard-real:hover { transform:translateY(-2px); }
    .cc-top-real { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
    .cc-name-real { font-size:16px; font-weight:700; margin-bottom:2px; }
    .cc-type-real { font-size:11px; opacity:0.85; }
    .cc-flag-real { font-size:22px; }
    .cc-limit-row-real { display:flex; justify-content:space-between; margin-bottom:6px; font-size:11px; opacity:0.9; }
    .cc-bar-real { height:5px; background:rgba(255,255,255,0.25); border-radius:3px; overflow:hidden; margin-bottom:12px; }
    .cc-bar-fill-real { height:100%; background:#fff; }
    .cc-footer-real { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .cc-status { font-size:10px; opacity:0.9; margin-bottom:2px; }
    .cc-fatura-real { font-size:18px; font-weight:800; }
    .cc-btns { display:flex; flex-direction:column; gap:6px; }
    .cc-btn-action { background:rgba(255,255,255,0.2); border:0.5px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .cc-btn-action:hover { background:rgba(255,255,255,0.3); }
  </style>
</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
        <div>
          <h1 class="page-hero-title">Cartões</h1>
          <p class="page-hero-sub">Gerencie seus cartões e faturas</p>
        </div>
      </div>
    </div>
  </div>

  <div id="summary-container"></div>

  <div id="list-container" style="padding:0 14px 14px;">
    <div class="skeleton" style="height:140px;border-radius:16px;"></div>
    <div class="skeleton" style="height:140px;border-radius:16px;"></div>
  </div>

</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="openModal()"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab on"><i class="ti ti-credit-card"></i><span>Cartões</span><span class="ndot"></span></a>
    <a href="goals.html" class="ntab"><i class="ti ti-target"></i><span>Metas</span></a>
  </div>
</div>

<!-- Modal novo cartão -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Novo Cartão</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label class="field-label">Nome do cartão *</label><input type="text" id="c-name" placeholder="Ex: Nubank, Itaú Visa..."></div>
    <div class="field"><label class="field-label">Limite total (R$)</label><input type="text" id="c-limit" placeholder="5.000,00" inputmode="decimal" oninput="currencyInput(this)" onblur="currencyBlur(this)"></div>
    <div class="grid-2">
      <div class="field"><label class="field-label">Dia fechamento</label><input type="number" id="c-closing" placeholder="10" min="1" max="31"></div>
      <div class="field"><label class="field-label">Dia vencimento</label><input type="number" id="c-due" placeholder="17" min="1" max="31"></div>
    </div>

    <label class="field-label" style="margin-bottom:8px;display:block;">Cor / Banco</label>
    <div class="preset-grid" id="preset-colors"></div>
    <div class="field"><label class="field-label">Cor personalizada</label><input type="color" id="c-color" value="#6D28D9" style="height:48px;cursor:pointer;width:100%;" onchange="onColorPickerChange()"></div>

    <button class="btn btn-primary" id="save-btn" onclick="saveCard()">Adicionar Cartão</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('cards.html');

  const PRESETS = [
    {name:'Itaú',       color:'#EC7000'},
    {name:'Nubank',     color:'#820AD1'},
    {name:'Santander',  color:'#EC0000'},
    {name:'Bradesco',   color:'#CC092F'},
    {name:'Banco do BR',color:'#FAE128'},
    {name:'Caixa',      color:'#0070AF'},
    {name:'Inter',      color:'#FF7A00'},
    {name:'C6 Bank',    color:'#1C1C1C'},
    {name:'BTG',        color:'#003163'},
    {name:'Original',   color:'#00B25C'},
    {name:'Next',       color:'#00FF5F'},
    {name:'PicPay',     color:'#11C76F'},
    {name:'Mercado Pago',color:'#00B1EA'},
    {name:'Will',       color:'#6610F2'},
    {name:'Outro',      color:'#6D28D9'}
  ];

  let selectedColor = '#6D28D9';

  function renderPresets() {
    document.getElementById('preset-colors').innerHTML = PRESETS.map(p => `
      <div class="preset-card ${p.color===selectedColor?'active':''}" style="background:${p.color};" data-color="${p.color}" data-name="${p.name}" onclick="selectPreset('${p.color}','${p.name}')">
        <span>${p.name}</span>
      </div>
    `).join('');
  }

  function selectPreset(color, name) {
    selectedColor = color;
    document.getElementById('c-color').value = color;
    if (!document.getElementById('c-name').value.trim()) {
      document.getElementById('c-name').value = name;
    }
    renderPresets();
  }

  function onColorPickerChange() {
    selectedColor = document.getElementById('c-color').value;
    renderPresets();
  }

  function currencyInput(el) { el.value = el.value.replace(/[^\d.,]/g,''); }
  function currencyBlur(el) {
    const num = parseCurrency(el.value);
    el.value = num > 0 ? num.toFixed(2).replace('.',',') : '';
  }
  function parseCurrency(val) {
    if (!val) return 0;
    let v = String(val).trim();
    if (v.includes('.')&&v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
    else if (v.includes(',')) v=v.replace(',','.');
    return parseFloat(v)||0;
  }

  async function load() {
    const cardsRes = await API.listCards();
    const cards = cardsRes.success ? cardsRes.data : [];

    if (cards.length === 0) {
      document.getElementById('summary-container').innerHTML = '';
      document.getElementById('list-container').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">💳</div>
          <p class="empty-text">Nenhum cartão cadastrado</p>
          <button class="btn btn-primary" style="max-width:220px;margin:0 auto;" onclick="openModal()">Adicionar cartão</button>
        </div>`;
      return;
    }

    // Resumo geral
    const totalLimit = cards.reduce((s,c)=>s+Number(c.limit_amount||0), 0);
    const totalUsed = cards.reduce((s,c)=>s+Number(c.current_invoice?.total_amount||0), 0);
    const totalAvailable = Math.max(0, totalLimit - totalUsed);
    const pct = totalLimit>0 ? Math.min(100, Math.round((totalUsed/totalLimit)*100)) : 0;

    // Próxima fatura a vencer
    const today = new Date();
    let nextDue = null;
    cards.forEach(c => {
      const dueDay = Number(c.due_day);
      const dueDate = new Date(today.getFullYear(), today.getMonth(), dueDay);
      if (dueDate < today) dueDate.setMonth(dueDate.getMonth()+1);
      if (!nextDue || dueDate < nextDue.date) nextDue = {date:dueDate, card:c};
    });

    document.getElementById('summary-container').innerHTML = `
      <div class="summary-card">
        <div class="summary-lbl">Limite total disponível</div>
        <div class="summary-total">${Utils.formatCurrency(totalAvailable)}</div>
        <div class="summary-row">
          <span class="summary-lbl">Usado: ${Utils.formatCurrency(totalUsed)}</span>
          <span class="summary-val">${pct}%</span>
        </div>
        <div class="summary-bar"><div class="summary-bar-fill" style="width:${pct}%;"></div></div>
        <div class="summary-row" style="margin-top:14px;margin-bottom:0;">
          <span class="summary-lbl">${cards.length} cartã${cards.length===1?'o':'es'} ativo${cards.length===1?'':'s'}</span>
          ${nextDue ? `<span class="summary-val">Próx. ${nextDue.card.name}: dia ${nextDue.card.due_day}</span>` : ''}
        </div>
      </div>
    `;

    document.getElementById('list-container').innerHTML = cards.map(card => {
      const limit = Number(card.limit_amount)||0;
      const inv = card.current_invoice;
      const used = Number(inv?.total_amount)||0;
      const available = Math.max(0, limit - used);
      const cardPct = limit > 0 ? Math.min(100, Math.round((used/limit)*100)) : 0;
      const statusLabel = inv ? (inv.status==='closed' ? '🔒 Fechada' : '🔓 Aberta') : '🔓 Aberta';
      const bgColor = card.color || '#6D28D9';

      return `
        <div class="cccard-real" style="background:linear-gradient(135deg, ${bgColor}, ${shadeColor(bgColor,-20)});" onclick="goToDetail('${card.card_id}')">
          <div class="cc-top-real">
            <div>
              <div class="cc-name-real">${card.name}</div>
              <div class="cc-type-real">Fecha dia ${card.closing_day} · Vence dia ${card.due_day}</div>
            </div>
            <div class="cc-flag-real">💳</div>
          </div>
          <div class="cc-limit-row-real">
            <span>Usado: ${Utils.formatCurrency(used)}</span>
            <span>Limite: ${Utils.formatCurrency(limit)}</span>
          </div>
          <div class="cc-bar-real"><div class="cc-bar-fill-real" style="width:${cardPct}%;"></div></div>
          <div class="cc-footer-real">
            <div>
              <div class="cc-status">${statusLabel} · ${Utils.formatCurrency(available)} disponível</div>
              <div class="cc-fatura-real">${Utils.formatCurrency(used)}</div>
            </div>
            <div class="cc-btns" onclick="event.stopPropagation()">
              ${inv && inv.status==='closed' ? `<button class="cc-btn-action" onclick="payInvoice('${inv.invoice_id}',${inv.total_amount})">Pagar fatura</button>` : ''}
              <button class="cc-btn-action" onclick="goToDetail('${card.card_id}')">Ver detalhes →</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);
    R = Math.max(0, Math.min(255, R));
    G = Math.max(0, Math.min(255, G));
    B = Math.max(0, Math.min(255, B));
    return '#' + R.toString(16).padStart(2,'0') + G.toString(16).padStart(2,'0') + B.toString(16).padStart(2,'0');
  }

  function goToDetail(cardId) {
    window.location.href = 'card-detail.html?id=' + cardId;
  }

  async function payInvoice(invoiceId, amount) {
    const res = await API.call('invoices.markPaid', {invoice_id:invoiceId, paid_date:new Date().toISOString().split('T')[0], paid_amount:amount});
    if (res.success) { Utils.toast('✅ Fatura paga!'); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  function openModal() {
    selectedColor = '#6D28D9';
    document.getElementById('c-color').value = selectedColor;
    document.getElementById('c-name').value = '';
    document.getElementById('c-limit').value = '';
    document.getElementById('c-closing').value = '';
    document.getElementById('c-due').value = '';
    renderPresets();
    document.getElementById('modal-overlay').classList.add('open');
  }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  async function saveCard() {
    const name = document.getElementById('c-name').value.trim();
    if (!name) { Utils.toast('Digite o nome do cartão','error'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled=true; btn.textContent='Salvando...';
    const res = await API.createCard({
      name,
      limit_amount: parseCurrency(document.getElementById('c-limit').value)||0,
      closing_day: parseInt(document.getElementById('c-closing').value)||1,
      due_day: parseInt(document.getElementById('c-due').value)||10,
      color: selectedColor
    });
    btn.disabled=false; btn.textContent='Adicionar Cartão';
    if (res.success) { Utils.toast('💳 Cartão adicionado!'); closeModal(); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  load();
</script>
</body>
</html>
