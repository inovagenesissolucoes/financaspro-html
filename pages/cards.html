<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Cartões</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row" style="gap:10px;">
      <div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;"><a href="dashboard.html" class="back-btn">&#8249;</a><div><h1 class="page-hero-title">Cartões</h1><p class="page-hero-sub">Gerencie seus cartões e faturas</p></div>
      <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
    </div>
  </div>

  <div id="list-container" style="padding:14px;">
    <div class="skeleton" style="height:140px;"></div>
    <div class="skeleton" style="height:140px;"></div>
  </div>

</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="openModal()"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab on"><i class="ti ti-credit-card"></i><span>Cartões</span><span class="ndot"></span></a>
    <a href="more.html" class="ntab"><i class="ti ti-dots"></i><span>Mais</span></a>
  </div>
</div>

<!-- Modal novo cartão -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Novo Cartão</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label class="field-label">Nome do cartão *</label><input type="text" id="c-name" placeholder="Ex: Nubank, Itaú Visa..."></div>
    <div class="field"><label class="field-label">Limite total (R$)</label><input type="number" id="c-limit" placeholder="5000" step="0.01"></div>
    <div class="grid-2">
      <div class="field"><label class="field-label">Dia fechamento</label><input type="number" id="c-closing" placeholder="10" min="1" max="31"></div>
      <div class="field"><label class="field-label">Dia vencimento</label><input type="number" id="c-due" placeholder="17" min="1" max="31"></div>
    </div>
    <div class="field"><label class="field-label">Cor</label><input type="color" id="c-color" value="#6D28D9" style="height:48px;cursor:pointer;"></div>
    <button class="btn btn-primary" id="save-btn" onclick="saveCard()">Adicionar Cartão</button>
  </div>
</div>

<!-- Modal compra no cartão -->
<div class="modal-overlay" id="purchase-modal" onclick="if(event.target===this)closePurchaseModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title">Nova Compra no Cartão</span><button class="modal-close" onclick="closePurchaseModal()">✕</button></div>
    <input type="hidden" id="purchase-card-id">
    <div class="field"><label class="field-label">Descrição *</label><input type="text" id="p-desc" placeholder="Ex: Supermercado, Roupa..."></div>
    <div class="field"><label class="field-label">Valor (R$) *</label><input type="number" id="p-amount" placeholder="0,00" step="0.01"></div>
    <div class="field"><label class="field-label">Data da compra *</label><input type="date" id="p-date"></div>
    <div class="field"><label class="field-label">Categoria</label><select id="p-category"><option value="">Sem categoria</option></select></div>
    <button class="btn btn-primary" id="p-save-btn" onclick="savePurchase()">Registrar Compra</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('cards.html');

  let categories = [];
  const CC_CLASSES = ['cc-purple','cc-blue','cc-green'];

  async function load() {
    const [cardsRes, catRes] = await Promise.all([API.listCards(), API.listCategories()]);
    categories = catRes.success ? catRes.data.filter(c=>c.type==='expense') : [];
    const cs = document.getElementById('p-category');
    cs.innerHTML = '<option value="">Sem categoria</option>' + categories.map(c=>`<option value="${c.category_id}">${c.icon||''} ${c.name}</option>`).join('');

    const cards = cardsRes.success ? cardsRes.data : [];
    if (cards.length === 0) {
      document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="empty-icon">💳</div><p class="empty-text">Nenhum cartão cadastrado</p><button class="btn btn-primary" style="max-width:200px;margin:0 auto;" onclick="openModal()">Adicionar cartão</button></div>`;
      return;
    }

    document.getElementById('list-container').innerHTML = cards.map((card, i) => {
      const limit = Number(card.limit_amount)||0;
      const inv = card.current_invoice;
      const used = Number(inv?.total_amount)||0;
      const available = Math.max(0, limit - used);
      const pct = limit > 0 ? Math.min(100, Math.round((used/limit)*100)) : 0;
      const status = inv ? (inv.status==='closed' ? '🔒 Fechada' : '🔓 Aberta') : '🔓 Aberta';
      const statusClass = inv?.status === 'closed' ? 'inv-closed' : 'inv-open';

      return `
        <div class="cccard ${CC_CLASSES[i%CC_CLASSES.length]}">
          <div class="cc-top">
            <div><div class="cc-name">${card.name}</div><div class="cc-type">Fecha dia ${card.closing_day} · Vence dia ${card.due_day}</div></div>
            <div class="cc-flag">💳</div>
          </div>
          <div class="cc-limit-row">
            <span class="cc-lbl">Usado: ${Utils.formatCurrency(used)}</span>
            <span class="cc-val">Limite: ${Utils.formatCurrency(limit)}</span>
          </div>
          <div class="cc-bar"><div class="cc-bar-fill" style="width:${pct}%;"></div></div>
          <div class="cc-footer">
            <div>
              <div class="cc-fatura-lbl">${status} · ${Utils.formatCurrency(available)} disponível</div>
              <div class="cc-fatura-val">${Utils.formatCurrency(used)}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
              <button class="cc-pay-btn" onclick="openPurchaseModal('${card.card_id}')">+ Compra</button>
              ${inv && inv.status==='closed' ? `<button class="cc-pay-btn" style="background:rgba(253,224,71,0.25);border-color:rgba(253,224,71,0.5);" onclick="payInvoice('${inv.invoice_id}',${inv.total_amount})">Pagar fatura</button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  async function payInvoice(invoiceId, amount) {
    const res = await API.call('invoices.markPaid', { invoice_id:invoiceId, paid_date:new Date().toISOString().split('T')[0], paid_amount:amount });
    if (res.success) { Utils.toast('✅ Fatura paga!'); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  function openModal() { document.getElementById('modal-overlay').classList.add('open'); }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  function openPurchaseModal(cardId) {
    document.getElementById('purchase-card-id').value = cardId;
    document.getElementById('p-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('purchase-modal').classList.add('open');
  }
  function closePurchaseModal() { document.getElementById('purchase-modal').classList.remove('open'); }

  async function savePurchase() {
    const desc = document.getElementById('p-desc').value.trim();
    const amount = parseFloat(document.getElementById('p-amount').value);
    const date = document.getElementById('p-date').value;
    const cardId = document.getElementById('purchase-card-id').value;
    if (!desc || !amount || !date) { Utils.toast('Preencha os campos obrigatórios','error'); return; }
    const btn = document.getElementById('p-save-btn');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const res = await API.createTransaction({ type:'expense', description:desc, expected_amount:amount, due_date:date, card_id:cardId, category_id:document.getElementById('p-category').value });
    btn.disabled = false; btn.textContent = 'Registrar Compra';
    if (res.success) { Utils.toast('✅ Compra registrada!'); closePurchaseModal(); ['p-desc','p-amount'].forEach(id=>document.getElementById(id).value=''); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  async function saveCard() {
    const name = document.getElementById('c-name').value.trim();
    if (!name) { Utils.toast('Digite o nome do cartão','error'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const res = await API.createCard({ name, limit_amount:parseFloat(document.getElementById('c-limit').value)||0, closing_day:parseInt(document.getElementById('c-closing').value)||1, due_day:parseInt(document.getElementById('c-due').value)||10, color:document.getElementById('c-color').value });
    btn.disabled = false; btn.textContent = 'Adicionar Cartão';
    if (res.success) { Utils.toast('💳 Cartão adicionado!'); closeModal(); document.getElementById('c-name').value=''; load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  load();
</script>
</body>
</html>
