<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Recorrências</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page">

  <div class="page-hero">
    <div class="page-hero-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-btn" onclick="openDrawer()"><i class="ti ti-menu-2"></i></button>
        <div>
          <h1 class="page-hero-title">Recorrências</h1>
          <p class="page-hero-sub">Contas fixas e receitas mensais</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Gerar mês -->
  <div style="padding:14px;">
    <div style="background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:var(--radius);padding:16px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <p style="font-size:13px;font-weight:700;color:#fff;">Gerar lançamentos do mês</p>
        <p style="font-size:11px;color:rgba(255,255,255,0.7);margin-top:2px;" id="gen-month-label"></p>
      </div>
      <button onclick="generateMonth()" id="gen-btn" style="background:rgba(255,255,255,0.2);border:0.5px solid rgba(255,255,255,0.3);color:#fff;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;">Gerar agora</button>
    </div>
  </div>

  <!-- Despesas Fixas -->
  <div class="sec">
    <div class="sec-hdr">
      <span class="sec-title">📤 Despesas Fixas</span>
      <button onclick="openModal('expense')" class="btn btn-sm btn-primary" style="width:auto;">+ Nova</button>
    </div>
    <div id="expense-list"><div class="skeleton"></div></div>
  </div>

  <div class="divider"></div>

  <!-- Receitas Recorrentes -->
  <div class="sec sec-last">
    <div class="sec-hdr">
      <span class="sec-title">📥 Receitas Recorrentes</span>
      <button onclick="openModal('income')" class="btn btn-sm btn-primary" style="width:auto;">+ Nova</button>
    </div>
    <div id="income-list"><div class="skeleton"></div></div>
  </div>

</div>

<div class="bnav-wrap">
  <div class="bnav">
    <a href="dashboard.html" class="ntab"><i class="ti ti-home"></i><span>Início</span></a>
    <a href="transactions.html" class="ntab"><i class="ti ti-list"></i><span>Lançamentos</span></a>
    <div class="ncenter"><button class="fab-nav" onclick="openModal('expense')"><i class="ti ti-plus"></i></button></div>
    <a href="cards.html" class="ntab"><i class="ti ti-credit-card"></i><span>Cartões</span></a>
    <a href="goals.html" class="ntab"><i class="ti ti-target"></i><span>Metas</span></a>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><span class="modal-title" id="modal-title">Nova Recorrência</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <input type="hidden" id="rec-type" value="expense">
    <div class="field"><label class="field-label">Descrição *</label><input type="text" id="rec-desc" placeholder="Ex: Aluguel, Salário, Netflix..."></div>
    <div class="field"><label class="field-label">Valor (R$) *</label><input type="number" id="rec-amount" placeholder="0,00" step="0.01"></div>
    <div class="field"><label class="field-label">Dia do mês *</label><input type="number" id="rec-day" placeholder="Ex: 5 = todo dia 5" min="1" max="31"></div>
    <div class="field"><label class="field-label">Categoria</label><select id="rec-category"><option value="">Sem categoria</option></select></div>
    <div class="field"><label class="field-label">Conta</label><select id="rec-account"><option value="">Sem conta</option></select></div>
    <button class="btn btn-primary" id="rec-save-btn" onclick="saveRecurrence()">Salvar Recorrência</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  if (!Auth.requireAuth()) throw '';
  applyTheme();
  injectNav('recurrences.html');

  let recType = 'expense', categories = [], accounts = [];
  document.getElementById('gen-month-label').textContent = Utils.formatMonth(Utils.getActiveMonth());

  async function load() {
    const [recRes, catRes, accRes] = await Promise.all([API.listRecurrences(), API.listCategories(), API.listAccounts()]);
    categories = catRes.success ? catRes.data : [];
    accounts = accRes.success ? accRes.data : [];
    const recs = recRes.success ? recRes.data : [];
    const expenses = recs.filter(r => r.type === 'expense');
    const incomes  = recs.filter(r => r.type === 'income');

    const renderRec = r => {
      const cat = categories.find(c => c.category_id === r.category_id);
      const acc = accounts.find(a => a.account_id === r.account_id);
      return `
        <div class="tx-card" style="margin-bottom:8px;">
          <div class="tx-ico" style="background:${cat?.color||'#6366F1'}22;">${cat?.icon||'🔄'}</div>
          <div class="tx-body">
            <div class="tx-name">${r.description}</div>
            <div class="tx-cat">Todo dia ${r.recurrence_day}${acc?' · '+acc.name:''}</div>
            <span class="badge" style="background:var(--accent-light);color:var(--accent-2);margin-top:4px;">🔄 Mensal</span>
          </div>
          <div class="tx-right">
            <div class="tx-amt ${r.type==='income'?'tx-pos':'tx-neg'}">${r.type==='income'?'+':'-'}${Utils.formatCurrency(r.expected_amount)}</div>
          </div>
        </div>`;
    };

    document.getElementById('expense-list').innerHTML = expenses.length > 0
      ? expenses.map(renderRec).join('')
      : '<p style="font-size:12px;color:var(--text-3);padding:8px 0;">Nenhuma despesa fixa cadastrada.</p>';
    document.getElementById('income-list').innerHTML = incomes.length > 0
      ? incomes.map(renderRec).join('')
      : '<p style="font-size:12px;color:var(--text-3);padding:8px 0;">Nenhuma receita recorrente cadastrada.</p>';
  }

  async function generateMonth() {
    const btn = document.getElementById('gen-btn');
    btn.disabled = true; btn.textContent = 'Gerando...';
    const res = await API.generateMonth(Utils.getActiveMonth());
    btn.disabled = false; btn.textContent = 'Gerar agora';
    if (res.success) {
      const count = res.data?.count || 0;
      Utils.toast(count > 0 ? `✅ ${count} lançamento(s) gerado(s)!` : '✅ Já gerados para este mês!');
    } else Utils.toast(res.error||'Erro','error');
  }

  function openModal(type) {
    recType = type;
    document.getElementById('rec-type').value = type;
    document.getElementById('modal-title').textContent = type === 'expense' ? 'Nova Despesa Fixa' : 'Nova Receita Recorrente';
    document.getElementById('rec-category').innerHTML = '<option value="">Sem categoria</option>' + categories.filter(c=>c.type===type).map(c=>`<option value="${c.category_id}">${c.icon||''} ${c.name}${c.subcategory ? ' · ' + c.subcategory : ''}</option>`).join('');
    document.getElementById('rec-account').innerHTML = '<option value="">Sem conta</option>' + accounts.map(a=>`<option value="${a.account_id}">${a.name}</option>`).join('');
    document.getElementById('modal-overlay').classList.add('open');
  }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  async function saveRecurrence() {
    const desc=document.getElementById('rec-desc').value.trim(), amount=parseFloat(document.getElementById('rec-amount').value), day=parseInt(document.getElementById('rec-day').value);
    if (!desc||!amount||!day) { Utils.toast('Preencha descrição, valor e dia','error'); return; }
    const btn=document.getElementById('rec-save-btn'); btn.disabled=true; btn.textContent='Salvando...';
    const res=await API.createRecurrence({description:desc,type:recType,expected_amount:amount,recurrence_day:day,category_id:document.getElementById('rec-category').value,account_id:document.getElementById('rec-account').value,start_date:new Date().toISOString().split('T')[0]});
    btn.disabled=false; btn.textContent='Salvar Recorrência';
    if (res.success) { Utils.toast('✅ Recorrência salva!'); closeModal(); ['rec-desc','rec-amount','rec-day'].forEach(id=>document.getElementById(id).value=''); load(); }
    else Utils.toast(res.error||'Erro','error');
  }

  load();
</script>
</body>
</html>
