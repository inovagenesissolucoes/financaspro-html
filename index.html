<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F172A">
</head>
<body>
  <div class="login-page">
    <div style="padding-top: 64px; text-align: center;">
      <div class="login-logo">💰</div>
      <h1 style="font-size:1.5rem; margin-bottom:6px;">FinançasPRO</h1>
      <p class="text-secondary text-sm">Seu controle financeiro pessoal</p>
    </div>

    <form id="login-form" style="display:flex; flex-direction:column; gap:14px;">
      <div class="field">
        <label class="field-label">Email</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label class="field-label">Senha</label>
        <div style="position:relative;">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="toggle-pass" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Entrar</button>
    </form>

    <div style="text-align:center; padding-bottom:32px;">
      <a href="recover.html" style="color:var(--accent-2); font-size:0.875rem; text-decoration:none;">Esqueci minha senha</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = 'pages/dashboard.html';

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      const result = await API.login(email, password);
      console.log('Login result:', JSON.stringify(result));

      if (result.success) {
        const token = result.token || result.data?.token;
        const user = result.user || result.data?.user;
        Auth.setSession(user, token);
        Utils.toast(`Bem-vindo, ${user?.name || ''}! 👋`);
        setTimeout(() => window.location.href = 'pages/dashboard.html', 500);
      } else {
        Utils.toast(result.error || 'Erro ao entrar', 'error');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
