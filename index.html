<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinançasPRO</title>
  <!-- ===== PWA (colar dentro do <head> de CADA página: index.html, recover.html e tudo em /pages) ===== -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinançasPRO">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }
</script>
<!-- ===== fim PWA ===== -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4338CA">
</head>
<body>
  <div class="login-page">
    <div style="padding-top:64px;text-align:center;">
      <div class="login-logo">💰</div>
      <h1 style="font-size:1.6rem;font-weight:700;margin-bottom:6px;">FinançasPRO</h1>
      <p class="text-secondary text-sm">Seu controle financeiro pessoal</p>
    </div>

    <form id="login-form" style="display:flex;flex-direction:column;gap:14px;">
      <div class="field">
        <label class="field-label">Email</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label class="field-label">Senha</label>
        <div style="position:relative;">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="toggle-pass" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Entrar</button>
    </form>

    <div style="text-align:center;padding-bottom:32px;">
      <a href="recover.html" style="color:#A78BFA;font-size:0.875rem;text-decoration:none;">Esqueci minha senha</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    applyTheme();
    if (Auth.isLoggedIn()) window.location.href = 'pages/dashboard.html';

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Entrando...';
      const result = await API.login(document.getElementById('email').value, document.getElementById('password').value);
      console.log('Login:', JSON.stringify(result));
      if (result.success) {
        const token = result.token || result.data?.token;
        const user = result.user || result.data?.user;
        Auth.setSession(user, token);
        Utils.toast(`Bem-vindo, ${user?.name?.split(' ')[0] || ''}! 👋`);
        setTimeout(() => window.location.href = 'pages/dashboard.html', 600);
      } else {
        Utils.toast(result.error || 'Email ou senha incorretos', 'error');
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
